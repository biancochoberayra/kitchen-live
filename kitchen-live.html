          <div class="prod-meta" style="margin-top:6px">${(p.items||[]).map(it=>it.cantidad+'× '+esc(it.nombre)).join(', ')}</div>
        </div>`).join('')}
    </div></div></details>
    ${cancelados.length>0?`${plegAbrir('cancelados','Pedidos cancelados', cancelados.length+' pedido(s)')}
    <div class="card" style="overflow-x:auto;margin-bottom:18px">
      <table><thead><tr><th>Hora</th><th>Mesa</th><th>Motivo</th></tr></thead><tbody>
        ${cancelados.map(p=>`<tr><td>${fmtTime(p.canceladoEn)}</td><td>Mesa ${esc(p.mesaNumero)}</td><td>${esc(p.motivoCancelacion||'—')}</td></tr>`).join('')}
      </tbody></table>
    </div></div></details>`:''}
    <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:18px">
      ${state.adminMode?`<div class="card" style="padding:14px;flex:1;min-width:260px">
        <b>Confirmar cierre del día</b>
        <p class="section-sub">${confirmado?'Este día ya fue confirmado y no admite más cambios.':'Una vez confirmado, el cierre de esta fecha queda bloqueado.'}</p>
        <button class="btn ${confirmado?'':'danger'}" id="btnConfirmarCierre" ${confirmado?'disabled':''}>${confirmado?'Cierre ya confirmado':'Confirmar cierre'}</button>
      </div>`:''}
    </div>
  `;
  document.getElementById('fFecha').onchange = (e)=>{ state.ui.cierreDate = e.target.value; render(); };
  document.querySelectorAll('details[data-plegable]').forEach(d=>d.addEventListener('toggle', ()=>{ state.ui.cierreSecciones[d.dataset.plegable] = d.open; }));
  document.getElementById('btnExportarCSV').onclick = ()=> exportarCierreExcel(fecha, cerrados, cancelados, totalVentas);
  const bcc = document.getElementById('btnConfirmarCierre');
  if(bcc) bcc.onclick = async ()=>{
    if(!requireAdmin()) return;
    if(!confirm('¿Confirmar el cierre del día '+fecha+'? Ya no se va a poder modificar.')) return;
    try{
      await dbCap.doc('cierres/'+fecha).set({
        fecha, confirmadoEn: Date.now(), totalVentas,
        mesasCerradas: cerrados.length, cajaDiferencia: cajaDelDia?cajaDelDia.diferencia:null
      });
      toast('Cierre confirmado');
    }catch(e){ toast('No se pudo confirmar el cierre'); }
  };
}
/* ---- Exportación a Excel (.xls), con colores y tamaños reales por celda ---- */
function xlsEsc(v){
  return String(v==null?'':v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function xlsTd(value, opts={}){
  const st = [`border:1px solid ${opts.border||'#cbd5e1'}`, 'padding:6px 11px', "font-family:Calibri,Arial,sans-serif"];
  st.push(`font-size:${opts.size||12}px`);
  if(opts.bg) st.push(`background:${opts.bg}`);
  if(opts.color) st.push(`color:${opts.color}`);
  if(opts.bold) st.push('font-weight:bold');
  st.push(`text-align:${opts.align||'left'}`);
  const attrs = opts.colspan?` colspan="${opts.colspan}"`:'';
  return `<td style="${st.join(';')}"${attrs}>${xlsEsc(value)}</td>`;
}
function xlsSectionRow(texto, colspan, bg){
  return `<tr>${xlsTd(texto, {bg, color:'#ffffff', bold:true, size:15, colspan, border:bg})}</tr>`;
}
function xlsHeadRow(cols){
  return `<tr>${cols.map(c=>xlsTd(c, {bg:'#e2e8f0', color:'#0f172a', bold:true, size:12, border:'#94a3b8'})).join('')}</tr>`;
}
const MEDIO_COLOR = {
  'Efectivo': {bg:'#dcfce7', color:'#166534'},
  'Tarjeta débito': {bg:'#dbeafe', color:'#1e40af'},
  'Tarjeta crédito': {bg:'#dbeafe', color:'#1e40af'},
  'MercadoPago': {bg:'#ede9fe', color:'#5b21b6'},
  'Mixto': {bg:'#fef3c7', color:'#92400e'},
};
function medioEstilo(medio){
  return MEDIO_COLOR[medio] || {bg:'#f1f5f9', color:'#334155'};
}
function exportarCierreExcel(fecha, cerrados, cancelados, totalVentas){
  const rows = [];
  rows.push(`<tr>${xlsTd('Cierre del día', {bg:'#0f172a', color:'#ffffff', bold:true, size:21, colspan:7, border:'#0f172a'})}</tr>`);
  rows.push(`<tr>${xlsTd(fecha, {bg:'#1e293b', color:'#94a3b8', bold:true, size:14, colspan:3, border:'#1e293b'})}${xlsTd('Ventas totales: '+fmtMoney(totalVentas), {bg:'#1e293b', color:'#38bdf8', bold:true, size:15, colspan:4, align:'right', border:'#1e293b'})}</tr>`);
  rows.push(`<tr><td colspan="7" style="border:none;padding:5px"></td></tr>`);

  rows.push(xlsSectionRow('VENTAS POR MESA', 6, '#0ea5e9'));
  rows.push(xlsHeadRow(['Mesa','Personas','Tenedores','Medio de pago','Total','Hora cierre']));
  cerrados.forEach((p,i)=>{
    const zebra = i%2===0?'#ffffff':'#f8fafc';
    const me = medioEstilo(p.medioPago);
    rows.push(`<tr>
      ${xlsTd(p.mesaNumero, {bg:zebra, bold:true})}
      ${xlsTd(p.personas, {bg:zebra, align:'right'})}
      ${xlsTd(p.tenedores, {bg:zebra, align:'right'})}
      ${xlsTd(p.medioPago||'', {bg:me.bg, color:me.color, bold:true})}
      ${xlsTd(p.total, {bg:zebra, align:'right', bold:true})}
      ${xlsTd(fmtTime(p.cerrado), {bg:zebra})}
    </tr>`);
  });
  rows.push(`<tr><td colspan="7" style="border:none;padding:5px"></td></tr>`);

  rows.push(xlsSectionRow('DETALLE DE PAGOS', 3, '#f59e0b'));
  rows.push(xlsHeadRow(['Mesa','Medio de pago','Monto']));
  let i2=0;
  cerrados.forEach(p=>{
    const pagos = (p.pagos&&p.pagos.length) ? p.pagos : [{medio:p.medioPago||'', monto:p.total}];
    pagos.forEach(pg=>{
      const zebra = i2%2===0?'#ffffff':'#f8fafc'; i2++;
      const me = medioEstilo(pg.medio);
      rows.push(`<tr>${xlsTd(p.mesaNumero,{bg:zebra,bold:true})}${xlsTd(pg.medio,{bg:me.bg,color:me.color,bold:true})}${xlsTd(pg.monto,{bg:zebra,align:'right'})}</tr>`);
    });
  });
  rows.push(`<tr><td colspan="7" style="border:none;padding:5px"></td></tr>`);

  rows.push(xlsSectionRow('ITEMS VENDIDOS', 7, '#22c55e'));
  rows.push(xlsHeadRow(['Mesa','Producto','Cantidad','Precio unitario','Subtotal','Opciones','Observaciones']));
  let i3=0;
  cerrados.forEach(p=>(p.items||[]).forEach(it=>{
    const zebra = i3%2===0?'#ffffff':'#f8fafc'; i3++;
    rows.push(`<tr>
      ${xlsTd(p.mesaNumero, {bg:zebra, bold:true})}
      ${xlsTd(it.nombre, {bg:zebra, bold:true})}
      ${xlsTd(it.cantidad, {bg:zebra, align:'right'})}
      ${xlsTd(it.precio, {bg:zebra, align:'right'})}
      ${xlsTd((it.precio||0)*(it.cantidad||0), {bg:zebra, align:'right', bold:true})}
      ${xlsTd(it.opcionesTexto||'', {bg:zebra, size:11, color:'#64748b'})}
      ${xlsTd(it.observaciones||'', {bg:zebra, size:11, color:'#64748b'})}
    </tr>`);
  }));
  rows.push(`<tr><td colspan="7" style="border:none;padding:5px"></td></tr>`);

  const productoAgg = {};
  cerrados.forEach(p=>(p.items||[]).forEach(it=>{ productoAgg[it.nombre] = (productoAgg[it.nombre]||0) + it.cantidad; }));
  const prodList = Object.entries(productoAgg).sort((a,b)=>b[1]-a[1]);
  const maxCant = prodList.length? prodList[0][1] : 1;
  rows.push(xlsSectionRow('PRODUCTOS VENDIDOS (resumen)', 2, '#0284c7'));
  rows.push(xlsHeadRow(['Producto','Cantidad total']));
  prodList.forEach(([nombre,cant],i)=>{
    const zebra = i%2===0?'#ffffff':'#f8fafc';
    const esTop = i===0 && cant===maxCant;
    rows.push(`<tr>${xlsTd(nombre,{bg:esTop?'#fef3c7':zebra, bold:esTop, color:esTop?'#92400e':undefined})}${xlsTd(cant,{bg:esTop?'#fef3c7':zebra, align:'right', bold:true, color:esTop?'#92400e':undefined})}</tr>`);
  });

  if(state.insumos.length>0 && state.productos.some(p=>(p.receta||[]).length>0)){
    const cv = costoVendido(cerrados);
    rows.push(`<tr><td colspan="7" style="border:none;padding:5px"></td></tr>`);
    rows.push(xlsSectionRow('RESULTADO ESTIMADO (según recetas)', 2, '#8b5cf6'));
    rows.push(xlsHeadRow(['Concepto','Monto']));
    rows.push(`<tr>${xlsTd('Ventas',{bg:'#ffffff',bold:true})}${xlsTd(totalVentas,{bg:'#ffffff',align:'right'})}</tr>`);
    rows.push(`<tr>${xlsTd('Costo de lo vendido',{bg:'#f8fafc',bold:true})}${xlsTd(Math.round(cv.costo),{bg:'#f8fafc',align:'right'})}</tr>`);
    rows.push(`<tr>${xlsTd('Margen bruto',{bg:'#ede9fe',bold:true,color:'#5b21b6'})}${xlsTd(Math.round(totalVentas-cv.costo),{bg:'#ede9fe',align:'right',bold:true,color:'#5b21b6'})}</tr>`);
  }

  if(cancelados && cancelados.length){
    rows.push(`<tr><td colspan="7" style="border:none;padding:5px"></td></tr>`);
    rows.push(xlsSectionRow('PEDIDOS CANCELADOS', 3, '#ef4444'));
    rows.push(xlsHeadRow(['Hora','Mesa','Motivo']));
    cancelados.forEach((p,i)=>{
      rows.push(`<tr>${xlsTd(fmtTime(p.canceladoEn),{bg:'#fef2f2',color:'#991b1b'})}${xlsTd(p.mesaNumero,{bg:'#fef2f2',color:'#991b1b',bold:true})}${xlsTd(p.motivoCancelacion||'',{bg:'#fef2f2',color:'#991b1b'})}</tr>`);
    });
  }

  const html = `<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:x="urn:schemas-microsoft-com:office:excel" xmlns="http://www.w3.org/TR/REC-html40">
<head><meta charset="UTF-8">
<!--[if gte mso 9]><xml><x:ExcelWorkbook><x:ExcelWorksheets><x:ExcelWorksheet>
<x:Name>Cierre ${xlsEsc(fecha)}</x:Name>
<x:WorksheetOptions><x:DisplayGridlines/></x:WorksheetOptions>
</x:ExcelWorksheet></x:ExcelWorksheets></x:ExcelWorkbook></xml><![endif]-->
<style>table{border-collapse:collapse}</style>
</head><body><table>${rows.join('')}</table><\/body><\/html>`;

  const blob = new Blob(['﻿'+html], {type:'application/vnd.ms-excel;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `cierre-${fecha}.xls`;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
}

/* ================= CONFIG ================= */
function renderConfig(app){
  if(!state.adminMode){
    app.innerHTML = `<div class="card empty"><b>Acceso restringido</b>Activá el modo administrador arriba a la derecha para configurar mesas, estaciones y el plano.</div>`;
    return;
  }
  const cfg = state.config;
  app.innerHTML = `
    <h2 class="section-title">Configuración</h2>
    <p class="section-sub">Ajustes generales del restaurante. Solo visibles y editables en modo administrador.</p>

    <div class="card" style="padding:16px;margin-bottom:16px">
      <h3 style="font-size:15px;margin-top:0">Zonas y plano del salón</h3>
      <p class="section-sub">Dividí el salón en zonas (ej: interior, terraza, planta alta) si el restaurante es grande — cada una puede tener su propio plano. Las mesas se colocan y reubican desde la sección Mapa, con el modo administrador activo.</p>
      <div class="zona-cols"><span></span><span>Nombre</span><span>Plano</span><span style="flex:none;width:30px"></span></div>
      <div id="zonasWrap" style="display:flex;flex-direction:column;gap:8px"></div>
      <div style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap">
        <button class="btn sm ghost" id="btnAddZona">+ Agregar zona</button>
        <button class="btn sm" id="btnSaveZonas">Guardar nombres de zonas</button>
      </div>
    </div>

    <div class="card" style="padding:16px;margin-bottom:16px">
      <h3 style="font-size:15px;margin-top:0">Mesas</h3>
      <p class="section-sub">Actualmente hay ${state.mesas.length} mesa(s). Para agregar o mover mesas, hacelo desde la sección Mapa (clic para agregar, arrastrar para reubicar).</p>
    </div>

    <div class="card" style="padding:16px;margin-bottom:16px">
      <h3 style="font-size:15px;margin-top:0">Mozos</h3>
      <p class="section-sub">Nombres del equipo de mozos, para poder elegir quién atiende cada mesa desde el Mapa y verlo en Cocina.</p>
      <div id="mozosWrap" style="display:flex;flex-direction:column;gap:6px">
        ${(cfg.mozos||[]).map((mz,i)=>`<div class="field-row" data-mzi="${i}" style="align-items:center">
          <input class="mz-nombre" value="${esc(mz.nombre)}" style="flex:1">
          <button class="iconbtn" data-delmozo="${i}">✕</button>
        </div>`).join('')}
      </div>
      <button class="btn sm ghost" id="btnAddMozo" style="margin-top:8px">+ Agregar mozo</button>
      <div style="margin-top:14px"><button class="btn sm" id="btnSaveMozos">Guardar mozos</button></div>
    </div>

    <div class="card" style="padding:16px;margin-bottom:16px">
      <h3 style="font-size:15px;margin-top:0">Cocina</h3>
      <div class="field-row">
        <div class="field"><label>Cantidad de cocineros</label><input type="number" min="0" id="fCocineros" value="${cfg.cocineros||0}"></div>
      </div>
      <h4 style="font-size:13px;margin:10px 0 6px">Estaciones</h4>
      <div id="estWrap" style="display:flex;flex-direction:column;gap:6px">
        ${(cfg.estaciones||[]).map((e,i)=>`<div class="field-row" data-ei="${i}" style="align-items:center">
          <input class="e-nombre" value="${esc(e.nombre)}" style="flex:1">
          <button class="iconbtn" data-delest="${i}">✕</button>
        </div>`).join('')}
      </div>
      <button class="btn sm ghost" id="btnAddEst" style="margin-top:8px">+ Agregar estación</button>
      <div style="margin-top:14px"><button class="btn" id="btnSaveCocina">Guardar cambios de cocina</button></div>
    </div>

    <div class="card" style="padding:16px;margin-bottom:16px">
      <h3 style="font-size:15px;margin-top:0">Seguridad</h3>
      <div class="field" style="max-width:220px"><label>PIN de administrador</label><input id="fPin" value="${esc(cfg.adminPin||'1234')}"></div>
      <p class="section-sub">Este PIN es un control de acceso simple para el equipo del restaurante, no reemplaza una autenticación real.</p>
      <button class="btn sm" id="btnSavePin" style="margin-top:6px">Guardar PIN</button>
    </div>

    <div class="card" style="padding:16px;margin-bottom:16px">
      <h3 style="font-size:15px;margin-top:0">Apariencia</h3>
      <p class="section-sub">Elegí el tema visual del sistema. Se guarda en este dispositivo.</p>
      <div style="display:flex;gap:8px">
        <button class="btn sm ${state.tema==='dark'?'':'ghost'}" id="btnTemaOscuro"><i class="fa-solid fa-moon"></i> Oscuro</button>
        <button class="btn sm ${state.tema==='light'?'':'ghost'}" id="btnTemaClaro"><i class="fa-solid fa-sun"></i> Claro</button>
      </div>
    </div>

    <div class="card" style="padding:16px;border:1px dashed var(--gold)">
      <h3 style="font-size:15px;margin-top:0">Datos de prueba</h3>
      <p class="section-sub">Carga mesas, productos, estaciones y pedidos de ejemplo (en distintos estados) para ver cómo se ve el sistema en uso. Pensado para demostraciones, no para un restaurante en producción.</p>
      <button class="btn gold" id="btnDemoData">Cargar datos de prueba</button>
      <button class="btn danger" id="btnWipeData" style="margin-left:8px">Vaciar todos los datos</button>
    </div>
  `;
  document.getElementById('btnDemoData').onclick = loadDemoData;
  document.getElementById('btnWipeData').onclick = wipeAllData;

  let zonas = JSON.parse(JSON.stringify(getZonas()));
  function zonaRowHtml(z,i){
    return `<div class="zona-row" data-zi="${i}">
      ${z.mapaUrl?`<img src="${z.mapaUrl}" class="zona-thumb" alt="Plano de ${esc(z.nombre)}">`:`<div class="zona-thumb-ph"><i class="fa-solid fa-image"></i></div>`}
      <input class="z-nombre" value="${esc(z.nombre)}">
      <input type="file" accept="image/png,image/jpeg,image/webp,image/gif" class="z-plano">
      <button class="iconbtn" data-delzona="${i}" ${zonas.length<=1?'disabled':''} title="Eliminar zona">✕</button>
    </div>`;
  }
  function readZonasFromDOM(){
    document.querySelectorAll('#zonasWrap > [data-zi]').forEach(el=>{
      const i = parseInt(el.dataset.zi);
      zonas[i].nombre = el.querySelector('.z-nombre').value.trim() || zonas[i].nombre;
    });
  }
  function rebindZonas(){
    document.getElementById('zonasWrap').innerHTML = zonas.map(zonaRowHtml).join('');
    document.querySelectorAll('[data-delzona]').forEach(b=>b.onclick=async ()=>{
      if(zonas.length<=1){ toast('Debe quedar al menos una zona'); return; }
      readZonasFromDOM();
      const removed = zonas.splice(parseInt(b.dataset.delzona),1)[0];
      try{
        await dbCap.doc('config/main').update({zonas});
        const afectadas = state.mesas.filter(m=>mesaZonaId(m)===removed.id);
        for(const m of afectadas){ await dbCap.doc('mesas/'+m.id).update({zonaId: zonas[0].id}); }
        toast('Zona eliminada'+(afectadas.length?`, ${afectadas.length} mesa(s) reasignada(s) a "${zonas[0].nombre}"`:''));
      }catch(err){ toast('No se pudo eliminar la zona'); }
      rebindZonas();
    });
    document.querySelectorAll('.z-plano').forEach(inp=>inp.addEventListener('change', async (e)=>{
      const i = parseInt(inp.closest('[data-zi]').dataset.zi);
      const file = e.target.files[0];
      if(!file) return;
      try{
        const res = await assetsCap.upload(file);
        readZonasFromDOM();
        zonas[i].mapaUrl = res.url; zonas[i].mapaAssetId = res.id;
        await dbCap.doc('config/main').update({zonas});
        toast('Plano de zona actualizado');
      }catch(err){ toast('No se pudo subir la imagen'); }
      rebindZonas();
    }));
  }
  rebindZonas();
  document.getElementById('btnAddZona').onclick = ()=>{
    readZonasFromDOM();
    zonas.push({id:'zona-'+uidLocal(), nombre:'Nueva zona', mapaUrl:null, mapaAssetId:null});
    rebindZonas();
  };
  document.getElementById('btnSaveZonas').onclick = async ()=>{
    readZonasFromDOM();
    try{ await dbCap.doc('config/main').update({zonas}); toast('Nombres de zonas guardados'); }
    catch(err){ toast('No se pudieron guardar los nombres'); }
  };

  let mozos = JSON.parse(JSON.stringify(cfg.mozos||[]));
  function rebindMozos(){
    document.getElementById('mozosWrap').innerHTML = mozos.map((mz,i)=>`<div class="field-row" data-mzi="${i}" style="align-items:center">
      <input class="mz-nombre" value="${esc(mz.nombre)}" style="flex:1">
      <button class="iconbtn" data-delmozo="${i}">✕</button>
    </div>`).join('');
    document.querySelectorAll('[data-delmozo]').forEach(b=>b.onclick=()=>{
      readMozosFromDOM();
      mozos.splice(parseInt(b.dataset.delmozo),1);
      rebindMozos();
    });
  }
  function readMozosFromDOM(){
    document.querySelectorAll('#mozosWrap [data-mzi]').forEach(el=>{
      const i = parseInt(el.dataset.mzi);
      mozos[i].nombre = el.querySelector('.mz-nombre').value;
    });
  }
  rebindMozos();
  document.getElementById('btnAddMozo').onclick = ()=>{
    readMozosFromDOM();
    mozos.push({id:uidLocal(), nombre:'Nuevo mozo'});
    rebindMozos();
  };
  document.getElementById('btnSaveMozos').onclick = async ()=>{
    readMozosFromDOM();
    try{ await dbCap.doc('config/main').update({mozos}); toast('Mozos guardados'); }
    catch(err){ toast('No se pudieron guardar los mozos'); }
  };

  let estaciones = JSON.parse(JSON.stringify(cfg.estaciones||[]));
  function rebindEst(){
    document.getElementById('estWrap').innerHTML = estaciones.map((e,i)=>`<div class="field-row" data-ei="${i}" style="align-items:center">
      <input class="e-nombre" value="${esc(e.nombre)}" style="flex:1">
      <button class="iconbtn" data-delest="${i}">✕</button>
    </div>`).join('');
    document.querySelectorAll('[data-delest]').forEach(b=>b.onclick=()=>{
      readEstFromDOM();
      if(estaciones.length<=1){ toast('Debe quedar al menos una estación'); return; }
      estaciones.splice(parseInt(b.dataset.delest),1);
      rebindEst();
    });
  }
  function readEstFromDOM(){
    document.querySelectorAll('#estWrap [data-ei]').forEach(el=>{
      const i = parseInt(el.dataset.ei);
      estaciones[i].nombre = el.querySelector('.e-nombre').value;
    });
  }
  document.querySelectorAll('[data-delest]').forEach(b=>b.onclick=()=>{
    if(estaciones.length<=1){ toast('Debe quedar al menos una estación'); return; }
    estaciones.splice(parseInt(b.dataset.delest),1);
    rebindEst();
  });
  document.getElementById('btnAddEst').onclick = ()=>{
    readEstFromDOM();
    estaciones.push({id:uidLocal(), nombre:'Nueva estación'});
    rebindEst();
  };
  document.getElementById('btnSaveCocina').onclick = async ()=>{
    readEstFromDOM();
    const cocineros = parseInt(document.getElementById('fCocineros').value)||0;
    try{
      await dbCap.doc('config/main').update({cocineros, estaciones});
      toast('Configuración de cocina guardada');
    }catch(e){ toast('No se pudo guardar'); }
  };
  document.getElementById('btnSavePin').onclick = async ()=>{
    const pin = document.getElementById('fPin').value.trim() || '1234';
    try{ await dbCap.doc('config/main').update({adminPin:pin}); toast('PIN actualizado'); }
    catch(e){ toast('No se pudo actualizar el PIN'); }
  };
  document.getElementById('btnTemaOscuro').onclick = ()=>{ aplicarTema('dark'); render(); toast('Tema oscuro activado'); };
  document.getElementById('btnTemaClaro').onclick = ()=>{ aplicarTema('light'); render(); toast('Tema claro activado'); };
}

    // --- MÁS COMANDAS ABIERTAS en distintos estados (para probar Cocina, "Retirado", cuenta pedida, etc.) ---
    const mozoPorId = {'mozo-1':'Lucía','mozo-2':'Martín','mozo-3':'Sofía','mozo-4':'Diego'};
    async function abrirMesaDemo(numero, estadoMesa, pax, mozoId, items, minAtras){

    await abrirMesaDemo(4, 'ocupada', 3, 'mozo-3', [

    await abrirMesaDemo(12, 'ocupada', 2, null, [
      itemFrom('Tabla de Fiambres', 1, 'preparando'),
      itemFrom('Copa de vino Malbec', 2, 'entregado'),
    ], 12);

    // --- HISTORIAL DE ~60 DÍAS (se escribe directo en la base y se guarda una sola vez: son cientos de pedidos) ---
    let seed = 20260101;
    const rnd = ()=>{ seed = (seed*1664525 + 1013904223)>>>0; return seed/4294967296; };
    const rint = (a,b)=>a+Math.floor(rnd()*(b-a+1));
    const pick = (a)=>a[Math.floor(rnd()*a.length)];
    const pickW = (pares)=>{ const tot = pares.reduce((t,[,w])=>t+w,0); let r = rnd()*tot; for(const [v,w] of pares){ if((r-=w)<=0) return v; } return pares[pares.length-1][0]; };
    const peso = {
      'Pizza Muzzarella':3, 'Milanesa napolitana':3, 'Sorrentinos de jamón y queso':2.2, 'Ñoquis de papa':1.4,
      'Parrillada para 2':1.6, 'Choripán clásico':1.6, 'Bife de chorizo':1.5,
      'Cerveza Artesanal IPA':3, 'Gaseosa línea Coca-Cola':3, 'Agua sin gas':1.6, 'Agua con gas':1.2, 'Copa de vino Malbec':1.8,
      'Vino Malbec (Botella)':0.7, 'Limonada con menta':1.3, 'Café':1.2,
      'Empanadas (docena)':2, 'Ensalada Caesar':1.4, 'Provoleta':1.5, 'Tabla de Fiambres':0.8, 'Rabas':0.6,
      'Flan casero':1.6, 'Tiramisú':1.2, 'Helado (2 bochas)':1.5, 'Cheesecake':1,
    };
    const activos = productosDef.filter(pd=>pd.activo!==false);
    const porCat = (...cats)=>activos.filter(pd=>cats.includes(pd.categoria)).map(pd=>[pd.nombre, peso[pd.nombre]||1]);
    const mains = porCat('Principales','Parrilla'), drinks = porCat('Bebidas'), entradas = porCat('Entradas'), postres = porCat('Postres');
    const mediosW = [['Efectivo',30],['Tarjeta débito',25],['Tarjeta crédito',25],['Transferencia',15],['Mixto',5]];
    const mozosW = [['mozo-1',34],['mozo-2',30],['mozo-3',22],['mozo-4',10],[null,4]];
    const motivos = ['Cliente se retiró','Error de carga','Producto agotado','Pedido duplicado','Demora excesiva en cocina'];

    const tsDia = (offsetDias, horaDec)=>{ const d=new Date(); d.setHours(0,0,0,0); d.setDate(d.getDate()-offsetDias); return d.getTime()+Math.round(horaDec*3600000); };
    function mkItem(nombre, cantidad, ts){
      const pr = prodRefs[nombre];
      const opciones = (pr.grupos||[]).filter(g=>g.obligatoria && g.opciones.length).map(g=>g.nombre+': '+g.opciones[rint(0,g.opciones.length-1)].nombre).join(' · ');
      return {id:uidLocal(), productoId:pr.id, nombre, cantidad, precio:pr.precio, opcionesTexto:opciones, observaciones:'', estado:'entregado', estacionId:pr.estacionId, creado:ts};
    }
    function mkItems(pax, ts){
      const cant = {};
      const sumar = (n,q)=>{ cant[n]=(cant[n]||0)+q; };
      for(let i=0;i<Math.max(1,Math.round(pax*0.9));i++) sumar(pickW(mains),1);
      for(let i=0;i<pax;i++) sumar(pickW(drinks),1);
      if(rnd()<0.5) sumar(pickW(entradas),1);
      if(rnd()<0.45) for(let i=0;i<rint(1,Math.min(pax,3));i++) sumar(pickW(postres),1);
      return Object.entries(cant).map(([n,q])=>mkItem(n,q,ts));
    }
    const bulk = (col, obj)=>{ if(!dbData[col]) dbData[col]={}; dbData[col][uidLocal()+(bulk.n++)] = obj; };
    bulk.n = 0;
    function pedidoHistorico(offsetDias, horaDec){
      const pax = pickW([[1,8],[2,40],[3,16],[4,22],[5,8],[6,6]]);
      const cerrado = tsDia(offsetDias, horaDec);
      const creado = cerrado - rint(35,85)*60000;
      const items = mkItems(pax, creado + rint(1,10)*60000);
      const total = items.reduce((t,it)=>t+it.precio*it.cantidad,0);
      const medio = pickW(mediosW);
      let pagos, medioPago = medio;
      if(medio==='Mixto'){ const a = Math.round(total*0.5/100)*100; pagos = [{medio:'Efectivo', monto:a},{medio:'Tarjeta débito', monto:total-a}]; }
      else pagos = [{medio, monto:total}];
      const mozoId = pickW(mozosW);
      const numero = rint(1,16);
      const base = {mesaId:'demo_h_'+numero, mesaNumero:numero, personas:pax, tenedores:pax, items, creado, total, ...(mozoId?{mozoId, mozoNombre:mozoPorId[mozoId]}:{})};
      if(rnd()<0.035){
        bulk('pedidos', {...base, total:0, estado:'cancelado', motivoCancelacion:pick(motivos), canceladoEn:cerrado});
        return null;
      }
      bulk('pedidos', {...base, estado:'cerrado', cerrado, medioPago, pagos});
      return {dia:offsetDias, total};
    }
    const horaServicio = ()=> rnd()<0.58 ? 12.5+rnd()*3 : 20.5+rnd()*3.2;
    const ventasDia = {};   // offsetDias -> {total, n}
    for(let off=1; off<=60; off++){
      const dow = new Date(Date.now()-off*86400000).getDay();      // 0 dom … 6 sáb
      const finde = (dow===5||dow===6||dow===0);
      const tendencia = 1 + (60-off)/60*0.35;                        // el negocio crece de a poco
      let n = Math.round((finde? rint(10,16) : rint(4,9)) * tendencia);
      if(off===17) n = Math.round(n*1.9);                            // un día récord (evento / promo)
      if(off===9 || off===31) n = Math.round(n*0.35);                // días flojos (lluvia)
      ventasDia[off] = {total:0, n:0};
      for(let i=0;i<n;i++){
        const r = pedidoHistorico(off, horaServicio());
        if(r){ ventasDia[off].total += r.total; ventasDia[off].n++; }
      }
    }
    // Hoy: más pedidos cerrados repartidos entre la apertura y ahora, y algunas cancelaciones
    const ahora = new Date(); const ahoraH = ahora.getHours()+ahora.getMinutes()/60;
    for(let i=0;i<8;i++) pedidoHistorico(0, Math.max(0.05, ahoraH - (0.4 + i*0.9)));
    bulk('pedidos', {mesaId:'demo_h_3', mesaNumero:3, personas:2, tenedores:2, items:[mkItem('Milanesa napolitana',2,Date.now()-90*60000)], creado:Date.now()-95*60000, total:0, estado:'cancelado', motivoCancelacion:'Cliente se retiró', canceladoEn:Date.now()-80*60000, mozoId:'mozo-1', mozoNombre:'Lucía'});
    bulk('pedidos', {mesaId:'demo_h_7', mesaNumero:7, personas:4, tenedores:4, items:[mkItem('Pizza Muzzarella',2,Date.now()-50*60000)], creado:Date.now()-55*60000, total:0, estado:'cancelado', motivoCancelacion:'Demora excesiva en cocina', canceladoEn:Date.now()-35*60000, mozoId:'mozo-2', mozoNombre:'Martín'});

    // Cierres confirmados de los días anteriores (ayer y anteayer quedan sin confirmar para poder probarlo)
    const difs = [0,0,0,0,-500,300,0,-1200,0,800];
    for(let off=3; off<=45; off++){
      const f = new Date(Date.now()-off*86400000);
      const fecha = f.getFullYear()+'-'+String(f.getMonth()+1).padStart(2,'0')+'-'+String(f.getDate()).padStart(2,'0');
      if(!dbData.cierres) dbData.cierres = {};
      dbData.cierres[fecha] = {fecha, confirmadoEn:tsDia(off-1, 1.5), totalVentas:ventasDia[off].total, mesasCerradas:ventasDia[off].n, cajaDiferencia:difs[off%difs.length]};
    }

    // Historial de cambios de precio
    [['Pizza Muzzarella',6500,6900,40],['Pizza Muzzarella',6900,7500,12],['Milanesa napolitana',8400,9200,25],['Parrillada para 2',19500,22000,20],
     ['Cerveza Artesanal IPA',3000,3500,8],['Tiramisú',3800,4200,28],['Flan casero',3400,3800,15],['Bife de chorizo',14000,15500,5]].forEach(([n,antes,nuevo,dias])=>{
      bulk('historialPrecios', {productoId:prodRefs[n].id, productoNombre:n, precioAnterior:antes, precioNuevo:nuevo, creado:tsDia(dias, 10+rnd()*2)});
    });

    // --- INVENTARIO: consumo según recetas, stock mínimo/ideal calibrados con las ventas, compras, mermas y conteos ---
    const recetaDe = {}; Object.entries(dbData.productos).forEach(([id,pr])=>{ recetaDe[id] = pr.receta||[]; });
    const consumoPorDia = {};     // fecha -> insumoId -> cantidad consumida
    Object.values(dbData.pedidos).forEach(pd=>{
      if(pd.estado==='cancelado') return;
      const f = dateOf(pd.cerrado || pd.creado);
      (pd.items||[]).forEach(it=>(recetaDe[it.productoId]||[]).forEach(r=>{
        const d = consumoPorDia[f] = consumoPorDia[f]||{};
        d[r.insumoId] = (d[r.insumoId]||0) + r.cantidad*it.cantidad;
      }));
    });
    const hoyStr = todayStr();
    const fechaHace = n=>{ const d=new Date(); d.setDate(d.getDate()-n); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); };
    const niceNum = (x, unidad)=> (unidad==='kg'||unidad==='l') ? Math.max(0.5, Math.ceil(x*2)/2) : Math.max(1, Math.ceil(x));
    Object.entries(dbData.insumos).forEach(([id,ins])=>{
      let suma = 0; for(let n=1;n<=14;n++) suma += (consumoPorDia[fechaHace(n)]||{})[id]||0;
      const prom = suma/14;                                       // consumo diario promedio
      ins.minimo = niceNum(prom*1.2, ins.unidad);
      ins.ideal  = niceNum(prom*4, ins.unidad);
      const hoy = (consumoPorDia[hoyStr]||{})[id]||0;
      ins.stock  = redondear(Math.max(0, niceNum(ins.ideal*(0.85+rnd()*0.25), ins.unidad) - hoy));
    });

    // Consumo: hoy ítem por ítem; los 7 días anteriores resumidos por día
    Object.values(dbData.pedidos).forEach(pd=>{
      if(pd.estado==='cancelado' || dateOf(pd.cerrado||pd.creado)!==hoyStr) return;
      (pd.items||[]).forEach(it=>(recetaDe[it.productoId]||[]).forEach(r=>{
        const ins = dbData.insumos[r.insumoId];
        bulk('movimientosInsumos', {insumoId:r.insumoId, insumoNombre:ins.nombre, unidad:ins.unidad, tipo:'consumo', delta:-redondear(r.cantidad*it.cantidad), motivo:'Mesa '+pd.mesaNumero+' · '+it.nombre, costoUnit:ins.costo, total:null, proveedor:'', creado:it.creado});
      }));
    });
    for(let off=1; off<=7; off++){
      Object.entries(consumoPorDia[fechaHace(off)]||{}).forEach(([id,q])=>{
        const ins = dbData.insumos[id];
        bulk('movimientosInsumos', {insumoId:id, insumoNombre:ins.nombre, unidad:ins.unidad, tipo:'consumo', delta:-redondear(q), motivo:'Ventas del día', costoUnit:ins.costo, total:null, proveedor:'', creado:tsDia(off, 23.5)});
      });
    }
    // Compras de los últimos ~60 días, con el precio un poco más bajo cuanto más viejas (inflación)
    const porProveedor = {};
    Object.entries(dbData.insumos).forEach(([id,ins])=>{ (porProveedor[ins.proveedor] = porProveedor[ins.proveedor]||[]).push(id); });
    const diasCompra = [1,4,8,12,16,21,26,32,38,45,52,58];
    Object.entries(porProveedor).forEach(([prov, ids])=>{
      diasCompra.forEach(off=>{
        if(rnd()<0.3) return;
        const ts = tsDia(off, 8+rnd()*3);
        ids.forEach(id=>{
          const ins = dbData.insumos[id];
          const cant = niceNum(ins.ideal*(0.7+rnd()*0.6), ins.unidad);
          const cu = redondear(ins.costo/(1+0.0035*off)*(0.98+rnd()*0.04), 2);
          bulk('movimientosInsumos', {insumoId:id, insumoNombre:ins.nombre, unidad:ins.unidad, tipo:'compra', delta:cant, motivo:'Compra · '+prov, costoUnit:cu, total:Math.round(cant*cu), proveedor:prov, creado:ts});
        });
      });
    });
    // Mermas y conteos
    const perecederos = Object.entries(dbData.insumos).filter(([,i])=>['Verdulería','Lácteos','Carnes','Pescados'].includes(i.rubro));
    const motivosMerma = ['Vencido / en mal estado','Se cayó o se derramó','Error de cocina','Cortesía o degustación'];
    for(let k=0;k<16;k++){
      const [id,ins] = pick(perecederos);
      const q = niceNum(ins.ideal*0.04*(1+rnd()), ins.unidad)/(ins.unidad==='un'||ins.unidad==='g'?1:2);
      const offM = k<2 ? 0 : rint(1,25);
      const horaM = offM===0 ? Math.max(0.1, ahoraH-1-k*0.5) : 10+rnd()*12;
      bulk('movimientosInsumos', {insumoId:id, insumoNombre:ins.nombre, unidad:ins.unidad, tipo:'merma', delta:-redondear(q), motivo:pick(motivosMerma), costoUnit:ins.costo, total:null, proveedor:'', creado:tsDia(offM, horaM)});
    }
    // Casos puntuales para probar alertas y la lista de compras
    const forzar = (nombre, valor, tipo, motivo)=>{
      const id = insRefs[nombre].id, ins = dbData.insumos[id];
      valor = ['un','g','ml'].includes(ins.unidad) ? Math.floor(valor) : redondear(valor,1);
      const delta = redondear(valor - ins.stock);
      ins.stock = valor;
      if(delta!==0) bulk('movimientosInsumos', {insumoId:id, insumoNombre:nombre, unidad:ins.unidad, tipo, delta, motivo, costoUnit:ins.costo, total:null, proveedor:'', creado:Date.now()-45*60000});
    };
    forzar('Calamar', 0, 'merma', 'Se terminó la tanda del proveedor');
    forzar('Ñoquis', redondear(dbData.insumos[insRefs['Ñoquis'].id].minimo*0.6), 'ajuste', 'Conteo físico');
    forzar('Provoleta (horma)', redondear(dbData.insumos[insRefs['Provoleta (horma)'].id].minimo*0.5), 'ajuste', 'Conteo físico');
    forzar('Salsa de tomate', redondear(dbData.insumos[insRefs['Salsa de tomate'].id].minimo*0.8), 'ajuste', 'Conteo físico');
    forzar('Huevo', redondear(dbData.insumos[insRefs['Huevo'].id].minimo*0.7), 'ajuste', 'Conteo físico');
    // un insumo desactivado (se dejó de usar)
    dbData.insumos[uidLocal()+'z'] = {nombre:'Ravioles de ricota', rubro:'Almacén', unidad:'kg', costo:8800, proveedor:'Distribuidora Norte', stock:0, minimo:0, ideal:0, activo:false};

    // Más movimientos manuales de caja hoy
    bulk('movimientosCaja', {tipo:'ingreso', medioPago:'Efectivo', concepto:'Aporte de cambio', monto:10000, creado:Date.now()-5.5*3600000});
    bulk('movimientosCaja', {tipo:'egreso', medioPago:'Efectivo', concepto:'Compra de hielo', monto:3500, creado:Date.now()-3*3600000});
    bulk('movimientosCaja', {tipo:'egreso', medioPago:'Efectivo', concepto:'Retiro a tesorería', monto:40000, creado:Date.now()-1.2*3600000});
    bulk('movimientosCaja', {tipo:'ingreso', medioPago:'Transferencia', concepto:'Seña de reserva (cumpleaños sábado)', monto:15000, creado:Date.now()-2*3600000});

    saveDB();
    ['pedidos','productos','mesas','insumos','movimientosInsumos','cierres','historialPrecios','movimientosCaja'].forEach(triggerDB);

    toast('Datos de prueba cargados con éxito');
  }catch(e){
    console.error(e);
    toast('Ocurrió un error cargando los datos de prueba');
  }
}
async function wipeAllData(){
  if(!requireAdmin()) return;
  if(!confirm('Esto borra TODAS las mesas, productos, insumos y pedidos guardados. ¿Confirmás?')) return;
  toast('Borrando datos…');
  try{
    // Se vacían las colecciones de una sola vez (y se guarda una sola vez): con cientos de pedidos de prueba, borrar de a uno es lento.
    ['mesas','productos','pedidos','movimientosCaja','movimientosStock','insumos','movimientosInsumos','cierres','historialPrecios','caja'].forEach(col=>{ dbData[col] = {}; });
    if(dbData.config && dbData.config.main) dbData.config.main = {...dbData.config.main, numMesas:0};
    saveDB();
    Object.keys(dbListeners).forEach(triggerDB);
    toast('Datos borrados');
  }catch(e){ toast('Error al borrar datos'); }
}

boot();
if(!localStorage.getItem(TUTORIAL_SEEN_KEY)){
  setTimeout(()=> openTutorial(0), 400);
}

function csvEscape(v){
  v = String(v==null?'':v);
  if(/[",\n]/.test(v)) v = '"'+v.replace(/"/g,'""')+'"';
  return v;
}
function exportarCierreCSV(fecha, cerrados, cancelados, totalVentas){
  const rows = [];
  rows.push(['Cierre del día', fecha]);
  rows.push(['Ventas totales', totalVentas]);
  rows.push([]);

  rows.push(['VENTAS POR MESA']);
  rows.push(['Mesa','Personas','Tenedores','Medio de pago','Total','Hora cierre']);
  cerrados.forEach(p=>rows.push([p.mesaNumero, p.personas, p.tenedores, p.medioPago||'', p.total, fmtTime(p.cerrado)]));
  rows.push([]);

  rows.push(['DETALLE DE PAGOS']);
  rows.push(['Mesa','Medio de pago','Monto']);
  cerrados.forEach(p=>{
    const pagos = (p.pagos&&p.pagos.length) ? p.pagos : [{medio:p.medioPago||'', monto:p.total}];
    pagos.forEach(pg=>rows.push([p.mesaNumero, pg.medio, pg.monto]));
  });
  rows.push([]);

  rows.push(['ITEMS VENDIDOS']);
  rows.push(['Mesa','Producto','Cantidad','Precio unitario','Subtotal','Opciones','Observaciones']);
  cerrados.forEach(p=>(p.items||[]).forEach(it=>{
    rows.push([p.mesaNumero, it.nombre, it.cantidad, it.precio, (it.precio||0)*(it.cantidad||0), it.opcionesTexto||'', it.observaciones||'']);
  }));
  rows.push([]);

  const productoAgg = {};
  cerrados.forEach(p=>(p.items||[]).forEach(it=>{ productoAgg[it.nombre] = (productoAgg[it.nombre]||0) + it.cantidad; }));
  rows.push(['PRODUCTOS VENDIDOS (resumen)']);
  rows.push(['Producto','Cantidad total']);
  Object.entries(productoAgg).sort((a,b)=>b[1]-a[1]).forEach(([nombre,cant])=>rows.push([nombre, cant]));

  if(cancelados && cancelados.length){
    rows.push([]);
    rows.push(['PEDIDOS CANCELADOS']);
    rows.push(['Hora','Mesa','Motivo']);
    cancelados.forEach(p=>rows.push([fmtTime(p.canceladoEn), p.mesaNumero, p.motivoCancelacion||'']));
  }

  const csv = rows.map(r=>r.map(csvEscape).join(',')).join('\n');
  const blob = new Blob(['﻿'+csv], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `cierre-${fecha}.csv`;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
}

      if(estaciones.length<=1){ toast('Debe quedar al menos una estación'); return; }

      rebindEst();
    });
  }

    document.querySelectorAll('#estWrap [data-ei]').forEach(el=>{
      const i = parseInt(el.dataset.ei);
      estaciones[i].nombre = el.querySelector('.e-nombre').value;
    });
  }
  document.querySelectorAll('[data-delest]').forEach(b=>b.onclick=()=>{
    if(estaciones.length<=1){ toast('Debe quedar al menos una estación'); return; }
    estaciones.splice(parseInt(b.dataset.delest),1);
    rebindEst();
  });
  document.getElementById('btnAddEst').onclick = ()=>{
    readEstFromDOM();
    estaciones.push({id:uidLocal(), nombre:'Nueva estación'});
    rebindEst();
  };
  document.getElementById('btnSaveCocina').onclick = async ()=>{
    readEstFromDOM();
    const cocineros = parseInt(document.getElementById('fCocineros').value)||0;
    try{
      await dbCap.doc('config/main').update({cocineros, estaciones});
      toast('Configuración de cocina guardada');
    }catch(e){ toast('No se pudo guardar'); }
  };
  document.getElementById('btnSavePin').onclick = async ()=>{
    const pin = document.getElementById('fPin').value.trim() || '1234';
    try{ await dbCap.doc('config/main').update({adminPin:pin}); toast('PIN actualizado'); }

  };

      const ref = await dbCap.collection('mesas').add({numero:m.numero, x:m.x, y:m.y, estado:'libre', pedidoId:null, zonaId:m.zonaId});
      mesaRefs.push({id:ref.id, ...m});
    }

    function itemFrom(nombreProd, cantidad, estado, opcionesTexto, observaciones){
      const p = prodRefs[nombreProd];
      if(!p) console.warn('Producto no encontrado en tests:', nombreProd);
      return {
        id:uidLocal(), productoId:p.id, nombre:p.nombre, cantidad, precio:p.precio, 
        opcionesTexto:opcionesTexto||'', observaciones:observaciones||'', 
        estado, estacionId:p.estacionId, creado:Date.now()-Math.floor(Math.random()*20*60000)
      };
    }

    // Mesa 2: pedido abierto (mozo recién toma el pedido)
    const items2 = [
      itemFrom('Parrillada para 2', 1, 'pendiente', 'Punto de cocción: A punto'),
      itemFrom('Cerveza Artesanal IPA', 2, 'pendiente'),
    ];
    const ped2 = await dbCap.collection('pedidos').add({mesaId:mesaRefs[1].id, mesaNumero:mesaRefs[1].numero, personas:2, tenedores:2, items:items2, estado:'abierto', creado:Date.now()-5*60000, total:0});
    await dbCap.doc('mesas/'+mesaRefs[1].id).update({estado:'ocupada', pedidoId:ped2.id});

    // Mesa 6: en preparación
    const items6 = [
      itemFrom('Pizza Muzzarella', 1, 'preparando'),
      itemFrom('Empanadas (docena)', 1, 'preparando', '', 'Mitad carne, mitad jamón y queso'),
      itemFrom('Gaseosa línea Coca-Cola', 4, 'entregado')
    ];
    const ped6 = await dbCap.collection('pedidos').add({mesaId:mesaRefs[5].id, mesaNumero:mesaRefs[5].numero, personas:4, tenedores:4, items:items6, estado:'abierto', creado:Date.now()-20*60000, total:0});
    await dbCap.doc('mesas/'+mesaRefs[5].id).update({estado:'ocupada', pedidoId:ped6.id});

    // Mesa 10: cuenta pedida
    const items10 = [
      itemFrom('Milanesa napolitana', 1, 'entregado', 'Guarnición: Papas fritas'),
      itemFrom('Ensalada Caesar', 1, 'entregado', 'Proteína: Pollo grillado'),
      itemFrom('Agua con gas', 2, 'entregado'),
      itemFrom('Tiramisú', 1, 'entregado')
    ];
    const ped10 = await dbCap.collection('pedidos').add({mesaId:mesaRefs[9].id, mesaNumero:mesaRefs[9].numero, personas:2, tenedores:2, items:items10, estado:'abierto', creado:Date.now()-50*60000, total:0});
    await dbCap.doc('mesas/'+mesaRefs[9].id).update({estado:'cuenta_pedida', pedidoId:ped10.id});

    // --- PEDIDOS CERRADOS (Historial para la caja/cierre) ---
    const generadorCerrados = [
      { num: 3, pax: 2, items: [ itemFrom('Sorrentinos de jamón y queso', 2, 'entregado', 'Salsa: Estofado'), itemFrom('Vino Malbec (Botella)', 1, 'entregado') ], pago: 'Efectivo', hrsAtras: 4 },
      { num: 7, pax: 5, items: [ itemFrom('Parrillada para 2', 2, 'entregado', 'Punto de cocción: Jugoso'), itemFrom('Choripán clásico', 1, 'entregado'), itemFrom('Cerveza Artesanal IPA', 5, 'entregado') ], pago: 'Tarjeta débito', hrsAtras: 3.5 },
      { num: 1, pax: 1, items: [ itemFrom('Ensalada Caesar', 1, 'entregado', 'Proteína: Sin proteína'), itemFrom('Agua sin gas', 1, 'entregado') ], pago: 'MercadoPago', hrsAtras: 2 },
      { num: 11, pax: 3, items: [ itemFrom('Milanesa napolitana', 2, 'entregado', 'Guarnición: Puré de papas'), itemFrom('Pizza Muzzarella', 1, 'entregado'), itemFrom('Gaseosa línea Coca-Cola', 3, 'entregado'), itemFrom('Flan casero', 3, 'entregado', 'Agregados: Dulce de Leche, Crema') ], pago: 'Tarjeta crédito', hrsAtras: 1.5 }
    ];

    for(const hist of generadorCerrados){
      const totalC = hist.items.reduce((s,it)=>s + it.precio*it.cantidad, 0);
      await dbCap.collection('pedidos').add({
        mesaId:'demo_c_'+hist.num, mesaNumero:hist.num, personas:hist.pax, tenedores:hist.pax, items:hist.items, estado:'cerrado',
        creado:Date.now()-(hist.hrsAtras+1)*3600000, cerrado:Date.now()-hist.hrsAtras*3600000, total:totalC, medioPago:hist.pago
      });
    }

    // --- CAJA DE EJEMPLO ---
    await dbCap.doc('caja/main').set({abierta:true, fecha:todayStr(), montoInicial:20000, abiertaEn:Date.now()-6*3600000, cerradaEn:null, montoRealCierre:null, diferencia:null});
    await dbCap.collection('movimientosCaja').add({tipo:'egreso', medioPago:'Efectivo', concepto:'Cambio para mozos', monto:5000, creado:Date.now()-5*3600000});

    toast('Datos de prueba cargados con éxito');
  }catch(e){
    console.error(e);
    toast('Ocurrió un error cargando los datos de prueba');
  }
}
async function wipeAllData(){
  if(!requireAdmin()) return;
  if(!confirm('Esto borra TODAS las mesas, productos y pedidos guardados. ¿Confirmás?')) return;
  toast('Borrando datos…');
  try{
    for(const m of state.mesas) await dbCap.doc('mesas/'+m.id).delete();
    for(const p of state.productos) await dbCap.doc('productos/'+p.id).delete();
    for(const p of state.pedidos) await dbCap.doc('pedidos/'+p.id).delete();
    for(const mv of state.movimientosCaja) await dbCap.doc('movimientosCaja/'+mv.id).delete();
    for(const mv of state.movimientosStock) await dbCap.doc('movimientosStock/'+mv.id).delete();
    for(const c of state.cierres) await dbCap.doc('cierres/'+c.id).delete();
    for(const h of state.historialPrecios) await dbCap.doc('historialPrecios/'+h.id).delete();
    await dbCap.doc('caja/main').delete();
    await dbCap.doc('config/main').update({numMesas:0});
    toast('Datos borrados');
  }catch(e){ toast('Error al borrar datos'); }
}

boot();
if(!localStorage.getItem(TUTORIAL_SEEN_KEY)){
  setTimeout(()=> openTutorial(0), 400);
}
</script>

<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>RestaurantFlow - Local</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
:root{
  /* Paleta tomada de cocina-ordu.html (azul marino + celeste) */
  --ink:#f8fafc;
  --ink-soft:#94a3b8;
  --paper:#0f172a;
  --paper-raise:#1e293b;
  --line:#334155;
  --brand:#0ea5e9;
  --brand-2:#38bdf8;
  --gold:#f59e0b;
  --gold-soft:rgba(245,158,11,.16);
  --ok:#22c55e;
  --ok-bg:rgba(34,197,94,.16);
  --warn:#f59e0b;
  --warn-bg:rgba(245,158,11,.16);
  --busy:#0ea5e9;
  --busy-bg:rgba(14,165,233,.16);
  --danger:#ef4444;
  --danger-bg:rgba(239,68,68,.16);
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px -12px rgba(0,0,0,.5);
}
:root[data-theme="light"]{
  --ink:#0f172a;
  --ink-soft:#64748b;
  --paper:#f1f5f9;
  --paper-raise:#ffffff;
  --line:#e2e8f0;
  --brand:#0ea5e9;
  --brand-2:#0284c7;
  --gold:#d97706;
  --gold-soft:rgba(217,119,6,.14);
  --ok:#16a34a;
  --ok-bg:rgba(22,163,74,.12);
  --warn:#d97706;
  --warn-bg:rgba(217,119,6,.12);
  --busy:#0284c7;
  --busy-bg:rgba(2,132,199,.12);
  --danger:#dc2626;
  --danger-bg:rgba(220,38,38,.12);
  --shadow: 0 1px 2px rgba(15,23,42,.06), 0 8px 24px -12px rgba(15,23,42,.18);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:'Plus Jakarta Sans',system-ui,-apple-system,sans-serif;
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,.brandfont{font-family:'Plus Jakarta Sans',system-ui,sans-serif}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;background:var(--paper-raise);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:14px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--brand-2);outline-offset:1px}
a{color:inherit}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:8px}

.app-shell{display:flex;min-height:100vh}

aside{
  width:250px;flex:none;
  background:var(--paper-raise);border-right:1px solid var(--line);
  display:flex;flex-direction:column;
  position:sticky;top:0;height:100vh;
}
.logo-container{
  padding:22px 20px;display:flex;align-items:center;gap:10px;
  font-weight:800;font-size:17px;letter-spacing:.2px;
  border-bottom:1px solid var(--line);
}
.logo-container i{color:var(--brand);font-size:1.35rem}

.rol-picker{padding:12px 16px;border-bottom:1px solid var(--line)}
.rol-picker label{display:block;font-size:11px;font-weight:700;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.4px;margin-bottom:5px}
.rol-picker select{width:100%;font-size:13px;padding:7px 8px}

.nav-links{list-style:none;margin:0;padding:14px 10px;flex:1;overflow-y:auto}
.nav-links li{margin-bottom:4px}
.nav-links a{
  display:flex;align-items:center;gap:12px;
  padding:10px 14px;border-radius:9px;
  color:var(--ink-soft);text-decoration:none;font-weight:600;font-size:13.5px;
}
.nav-links a i{width:18px;text-align:center;font-size:14px}
.nav-links a:hover{background:var(--line);color:var(--ink)}
.nav-links a.active{background:var(--brand);color:#fff}

.sidebar-foot{padding:14px 10px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
.side-link{
  display:flex;align-items:center;gap:10px;text-decoration:none;
  color:var(--ink-soft);font-weight:600;font-size:13px;
  padding:8px 10px;border-radius:8px;
}
.side-link:hover{background:var(--line);color:var(--ink)}
.side-link i{width:16px;text-align:center}
.adminbtn{
  white-space:nowrap;border:1px solid var(--line);background:transparent;color:var(--ink);
  padding:8px 12px;border-radius:8px;font-weight:700;font-size:13px;margin-top:4px;
}
.adminbtn.on{background:var(--gold);border-color:var(--gold);color:#241a04}

.main-content{flex:1;min-width:0;display:flex;flex-direction:column}
header{
  position:sticky;top:0;z-index:20;
  background:var(--paper-raise);border-bottom:1px solid var(--line);
  padding:16px 26px;display:flex;align-items:center;justify-content:space-between;
  box-shadow:var(--shadow);
}
header h1{font-size:1.2rem;margin:0}
.clock{color:var(--ink-soft);font-size:13px;font-weight:600}

.wrap{max-width:1180px;margin:0 auto;padding:18px 26px 60px}
.wrap.wrap-wide{width:100%}
/* Grillas de 4 columnas (3 en pantallas medianas, 2 en chicas) para Cocina y Productos */
.grid-4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:1240px){.grid-4{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:860px){.grid-4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:520px){.grid-4.tickets{grid-template-columns:1fr}}

/* Secciones plegables (Cierre) */
details.plegable{margin-bottom:14px}
details.plegable>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;font-weight:800;font-size:15px;padding:8px 0;user-select:none}
details.plegable>summary::-webkit-details-marker{display:none}
details.plegable>summary::before{content:'▾';display:inline-block;width:16px;color:var(--ink-soft);transition:transform .15s}
details.plegable:not([open])>summary::before{transform:rotate(-90deg)}
details.plegable>summary:hover{color:var(--brand-2)}
.pleg-resumen{font-weight:600;font-size:12.5px;color:var(--ink-soft)}

/* Salón: selector Plano / Lista y tarjetas de mesa (vista cómoda para celular) */
.vista-toggle{display:inline-flex;border:1px solid var(--line);border-radius:100px;overflow:hidden;background:var(--paper-raise);flex:none}
.vista-toggle button{border:0;background:transparent;padding:8px 14px;font-weight:700;font-size:13px;color:var(--ink-soft);display:inline-flex;align-items:center;gap:6px}
.vista-toggle button.on{background:var(--brand);color:#fff}
.mesa-filtros{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.mesa-filtros button{border:1px solid var(--line);background:var(--paper-raise);border-radius:100px;padding:6px 12px;font-size:12.5px;font-weight:700;color:var(--ink)}
.mesa-filtros button.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.mesas-lista{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.mesa-card{text-align:left;border:1px solid var(--line);border-left:6px solid var(--ok);border-radius:12px;background:var(--paper-raise);
  padding:12px;display:flex;flex-direction:column;gap:4px;min-height:92px;color:var(--ink)}
.mesa-card.st-ocupada{border-left-color:var(--busy)}
.mesa-card.st-cuenta{border-left-color:var(--danger);background:var(--danger-bg)}
.mesa-card:active{transform:scale(.98)}
.mc-top{display:flex;justify-content:space-between;align-items:baseline;gap:6px}
.mc-num{font-size:22px;font-weight:800;line-height:1}
.mc-estado{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.3px;color:var(--ink-soft)}
.mc-info{font-size:12.5px;color:var(--ink-soft)}
.mc-listo{color:var(--ok)}
/* Cocina (rol Mozo) */
.mozo-filtro{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.mozo-filtro-label{font-size:12px;font-weight:800;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.4px}
.seccion-retirar{display:flex;align-items:center;gap:8px;font-size:16px;font-weight:800;margin:6px 0 10px}
.mozo-grupo{display:flex;align-items:center;gap:8px;font-weight:800;font-size:14px;margin:14px 0 8px;color:var(--ink)}
.mozo-grupo i{color:var(--ink-soft);font-size:12px}
.grid-4.listos .ticket{border-color:var(--ok);box-shadow:0 0 0 1px var(--ok) inset}


.card{background:var(--paper-raise);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}
.section-title{font-size:20px;font-weight:800;margin:0 0 4px}
.section-sub{color:var(--ink-soft);font-size:13.5px;margin:0 0 16px}

.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:3px 9px;border-radius:100px}
.pill.ok{background:var(--ok-bg);color:var(--ok)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.busy{background:var(--busy-bg);color:var(--busy)}
.pill.danger{background:var(--danger-bg);color:var(--danger)}
.pill.neutral{background:var(--paper);color:var(--ink-soft);border:1px solid var(--line)}

.btn{border:none;border-radius:9px;padding:9px 14px;font-weight:700;font-size:13.5px;background:var(--brand);color:#fff}
.btn:hover{background:var(--brand-2)}
.btn.gold{background:var(--gold);color:#241a04}
.btn.gold:hover{filter:brightness(1.05)}
.btn.ghost{background:transparent;color:var(--brand);border:1.5px solid var(--brand)}
.btn.danger{background:var(--danger);color:#fff}
.btn.sm{padding:6px 10px;font-size:12.5px;border-radius:7px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.iconbtn{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:6px 9px;font-size:13px;font-weight:700;color:var(--ink)}

.wrap.wrap-mapa{max-width:1560px}
.mapa-toolbar{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;margin-bottom:12px}
.mapa-toolbar .stationbar{margin:0;flex:1;min-width:200px}
.zona-switcher{display:flex;align-items:center;gap:10px;background:var(--paper);border:1px solid var(--line);
  border-radius:100px;padding:6px 8px;flex:1;min-width:230px}
.zona-switcher button{background:var(--brand);color:#fff;border:none;width:34px;height:34px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;font-size:14px;flex:none}
.zona-switcher button:hover{background:var(--brand-2)}
.zona-switcher-label{flex:1;text-align:center;font-weight:800;font-size:14.5px;display:flex;align-items:center;
  justify-content:center;gap:8px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mapa-shell{position:relative;border-radius:14px;overflow:hidden;border:1px solid var(--line);background:
  repeating-linear-gradient(45deg, var(--paper) 0 12px, var(--paper-raise) 12px 24px);
  min-height:420px;}
@media (min-width:900px){
  .mapa-shell{min-height:min(72vh, 760px)}
}
.mapa-shell img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;pointer-events:none}
.mesa-chip{
  position:absolute;transform:translate(-50%,-50%);
  width:58px;height:58px;border-radius:12px;border:2px solid transparent;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  color:#fff;font-weight:800;font-size:15px;box-shadow:0 3px 10px rgba(0,0,0,.25);
  user-select:none;
}
.mesa-chip small{font-size:9px;font-weight:700;opacity:.9;text-transform:uppercase;letter-spacing:.3px}
.mesa-chip.st-libre{background:var(--ok)}
.mesa-chip.st-ocupada{background:var(--busy)}
.mesa-chip.st-cuenta{background:var(--danger)}
.mesa-chip.draggable{cursor:grab;border-color:var(--gold)}
.mesa-chip.draggable:active{cursor:grabbing}

.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-soft);margin-top:10px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}

.modal-bg{position:fixed;inset:0;background:rgba(10,18,17,.5);display:flex;align-items:center;justify-content:center;z-index:100;padding:16px}
.modal{background:var(--paper-raise);border-radius:16px;max-width:560px;width:100%;max-height:88vh;overflow-y:auto;padding:20px;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.modal.wide{max-width:760px}
.modal.xwide{max-width:920px}
.modal h3{margin:0 0 2px}
.modal-close{float:right;background:var(--paper);border:1px solid var(--line);border-radius:8px;width:30px;height:30px;font-size:16px;color:var(--ink-soft)}

.field-row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.field{display:flex;flex-direction:column;gap:4px;flex:1;min-width:120px}
.field label{font-size:12px;font-weight:700;color:var(--ink-soft)}

table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;color:var(--ink-soft);font-size:11.5px;text-transform:uppercase;letter-spacing:.4px;font-weight:700;padding:8px 10px;border-bottom:1px solid var(--line)}
td{padding:9px 10px;border-bottom:1px solid var(--line)}
tr:last-child td{border-bottom:none}

.grid-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.prod-card{border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--paper-raise);display:flex;flex-direction:column;gap:6px}
.prod-card.inactive{opacity:.5}
.prod-name{font-weight:800;font-size:14.5px}
.prod-meta{font-size:12px;color:var(--ink-soft)}
.prod-price{font-weight:800;color:var(--brand-2);font-size:15px}

.stationbar{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;margin-bottom:14px}
.stationbar button{white-space:nowrap;border:1px solid var(--line);background:var(--paper-raise);border-radius:100px;padding:7px 14px;font-weight:700;font-size:13px;color:var(--ink)}
.stationbar button.active{background:var(--brand);color:#fff;border-color:var(--brand)}

.ticket{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--paper-raise);display:flex;flex-direction:column;gap:8px}
.ticket-head{display:flex;justify-content:space-between;align-items:baseline}
.ticket-mesa{font-weight:800;font-size:14px}
.ticket-mozo{font-weight:600;color:var(--ink-soft);font-size:12.5px}
.ticket-time{font-size:11.5px;color:var(--ink-soft)}
.ticket-item{font-size:13.5px;font-weight:700}
.ticket-opts{font-size:12px;color:var(--ink-soft);margin-top:-4px}
.ticket-obs{font-size:12px;color:var(--warn);font-style:italic}
.ticket-actions{display:flex;gap:6px;margin-top:4px}

.empty{padding:32px 18px;text-align:center;color:var(--ink-soft)}
.empty b{display:block;color:var(--ink);font-size:15px;margin-bottom:4px}

.mesa-item-row{border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.opts-editor-group{border:1px dashed var(--line);border-radius:10px;padding:10px;margin-bottom:8px}
.zona-row{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:10px;padding:8px 10px;flex-wrap:wrap}
.zona-thumb{width:42px;height:42px;border-radius:8px;object-fit:cover;border:1px solid var(--line);flex:none}
.zona-thumb-ph{width:42px;height:42px;border-radius:8px;border:1px dashed var(--line);display:flex;align-items:center;justify-content:center;color:var(--ink-soft);flex:none;font-size:14px}
.zona-row .z-nombre{flex:1;min-width:110px}
.zona-row .z-plano{flex:1;min-width:150px;max-width:230px}
.zona-cols{display:flex;gap:10px;padding:0 10px 4px;font-size:11px;font-weight:700;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.4px}
.zona-cols span:first-child{width:42px}
.zona-cols span{flex:1}
.chip-toggle{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:100px;padding:5px 11px;font-size:12.5px;font-weight:600;cursor:pointer;background:var(--paper-raise)}
.chip-toggle.sel{background:var(--brand);border-color:var(--brand);color:#fff}
.badge-count{background:var(--gold-soft);color:var(--gold);border-radius:100px;padding:2px 8px;font-size:11px;font-weight:800}

.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 18px;border-radius:100px;font-size:13.5px;font-weight:600;z-index:200;box-shadow:0 10px 30px rgba(0,0,0,.3)}

#mobileMenuBtn{display:none;position:fixed;top:12px;left:12px;z-index:90;width:40px;height:40px;border-radius:50%;
  align-items:center;justify-content:center;background:var(--paper-raise);border:1px solid var(--line);
  color:var(--ink);box-shadow:var(--shadow);font-size:15px}
#asideBackdrop{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:70}
#asideBackdrop.show{display:block}
@media (max-width:780px){
  .app-shell{flex-direction:column}
  aside{
    position:fixed;top:0;left:0;height:100vh;width:250px;max-width:82vw;
    transform:translateX(-100%);transition:transform .22s ease;z-index:80;
  }
  aside.open{transform:translateX(0);box-shadow:0 0 40px rgba(0,0,0,.5)}
  #mobileMenuBtn{display:flex}
  header{padding:12px 16px 12px 60px}
  header h1{font-size:1.05rem}
  .wrap{padding:14px 12px 50px}
  .mapa-toolbar{flex-direction:column;align-items:stretch}
  .mapa-toolbar .field{max-width:none !important;width:100%}
  .zona-switcher{min-width:0;width:100%}
  .vista-toggle{align-self:flex-start}
  .mapa-shell{min-height:62vh}
  .mesa-chip{width:48px;height:48px;font-size:14px}
  table{min-width:480px}
  /* ventanas como "hoja" desde abajo, con botones y campos cómodos para el pulgar */
  .modal-bg{align-items:flex-end;padding:0}
  .modal,.modal.wide,.modal.xwide{max-width:none;width:100%;max-height:92vh;border-radius:18px 18px 0 0;padding:16px 14px calc(18px + env(safe-area-inset-bottom))}
  .modal .btn{flex:1 1 auto;min-height:44px}
  .btn.sm{min-height:38px}
  input,select,textarea{font-size:16px}
  .mesa-item-row{flex-wrap:wrap}
  .mesa-item-row>div:last-child{align-items:flex-start}
  .chip-toggle{padding:8px 13px;font-size:13.5px}
  .stationbar button{padding:9px 15px}
}
@media (max-width:520px){
  .mesas-lista{grid-template-columns:repeat(2,minmax(0,1fr))}
  .mapa-shell{min-height:56vh}
}
</style>
<script>
  // Aplica el tema guardado antes de pintar, para evitar el parpadeo del tema por defecto.
  try{
    const t = localStorage.getItem('restaurantFlowTema');
    if(t==='light') document.documentElement.setAttribute('data-theme','light');
  }catch(e){}
</script>
</head>
<body>

<button id="mobileMenuBtn" aria-label="Menú"><i class="fa-solid fa-bars"></i></button>
<div id="asideBackdrop"></div>
<div class="app-shell">
  <aside id="asideEl">
    <div class="logo-container brandfont"><i class="fa-solid fa-utensils"></i><span>RestaurantFlow</span></div>
    <div class="rol-picker">
      <label for="rolSelect">Rol</label>
      <select id="rolSelect">
        <option value="admin">Administrador</option>
        <option value="mozo">Mozo</option>
        <option value="cocina">Cocina</option>
        <option value="caja">Caja</option>
      </select>
    </div>
    <ul class="nav-links" id="navtabs"></ul>
    <div class="sidebar-foot">
      <a class="side-link" href="pantalla-cocina.html"><i class="fa-solid fa-tv"></i><span>Pantalla cocina</span></a>
      <a class="side-link" href="dashboard.html"><i class="fa-solid fa-chart-line"></i><span>Dashboard</span></a>
      <button class="side-link" id="btnAyuda" style="border:none;background:none;text-align:left;cursor:pointer;width:100%"><i class="fa-solid fa-circle-question"></i><span>Ayuda / Tutorial</span></button>
      <button class="adminbtn" id="adminToggle">Modo admin</button>
    </div>
  </aside>
  <div class="main-content">
    <header>
      <h1 id="headerTitle">Salón</h1>
      <span class="clock" id="reloj"></span>
    </header>
    <div class="wrap" id="app"></div>
  </div>
</div>
<div id="modalRoot"></div>
<div id="toastRoot"></div>

<script>
const VIEWS = [
  {id:'mapa', label:'Mapa · Mozo', icon:'fa-house', titulo:'Salón'},
  {id:'cocina', label:'Cocina', icon:'fa-fire-burner', titulo:'Cocina'},
  {id:'productos', label:'Productos', icon:'fa-burger', titulo:'Productos'},
  {id:'inventario', label:'Inventario', icon:'fa-boxes-stacked', titulo:'Inventario'},
  {id:'caja', label:'Caja', icon:'fa-cash-register', titulo:'Caja'},
  {id:'cierre', label:'Cierre', icon:'fa-chart-pie', titulo:'Cierre del día'},
  {id:'config', label:'Config', icon:'fa-gear', titulo:'Configuración'},

const ROLES = {

/* ---------------- LOCALSTORAGE DB MOCK ---------------- */
// Este bloque reemplaza la necesidad de usar una base de datos externa.
const DB_KEY = 'restaurantFlowLocalDB';
let dbData = JSON.parse(localStorage.getItem(DB_KEY)) || { config: {}, mesas: {}, productos: {}, pedidos: {} };

function saveDB() { localStorage.setItem(DB_KEY, JSON.stringify(dbData)); }
const dbListeners = { config:[], mesas:[], productos:[], pedidos:[], movimientosCaja:[], caja:[], insumos:[], movimientosInsumos:[], cierres:[], historialPrecios:[] };
function triggerDB(col) { dbListeners[col].forEach(cb => cb()); }

const dbCap = {
  doc: (path) => {
    const [col, id] = path.split('/');
    return {
      onSnapshot: (cb) => {
        const fire = () => {
          if (dbData[col] && dbData[col][id]) cb({ exists: true, data: dbData[col][id], id });
          else cb({ exists: false, id });
        };
        dbListeners[col].push(fire);
        setTimeout(fire, 0);
      },
      set: async (data) => {
        if(!dbData[col]) dbData[col] = {};
        dbData[col][id] = data;
        saveDB(); triggerDB(col);
      },
      update: async (data) => {
        if(!dbData[col] || !dbData[col][id]) throw new Error('Not found');
        dbData[col][id] = { ...dbData[col][id], ...data };
        saveDB(); triggerDB(col);
      },
      delete: async () => {
        if(dbData[col]) delete dbData[col][id];
        saveDB(); triggerDB(col);
      }
    };
  },
  collection: (col) => {
    let sortField = null;
    let sortDir = 'asc';
    const coll = {
      orderBy: (field, dir) => { sortField = field; sortDir = dir; return coll; },
      onSnapshot: (cb) => {
        const fire = () => {
          let docs = Object.keys(dbData[col]||{}).map(id => ({ id, data: dbData[col][id] }));
          if (sortField) {
            docs.sort((a,b) => {
              let valA = a.data[sortField];
              let valB = b.data[sortField];
              if(typeof valA === 'string') return sortDir === 'asc' ? valA.localeCompare(valB) : valB.localeCompare(valA);
              return sortDir === 'asc' ? (valA||0) - (valB||0) : (valB||0) - (valA||0);
            });
          }
          cb({ docs });
        };
        dbListeners[col].push(fire);
        setTimeout(fire, 0);
      },
      add: async (data) => {
        const id = uidLocal();
        if(!dbData[col]) dbData[col] = {};
        dbData[col][id] = data;
        saveDB(); triggerDB(col);
        return { id };
      }
    };
    return coll;
  }
};

const assetsCap = {
  upload: (file) => new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = (e) => resolve({ id: uidLocal(), url: e.target.result });
    reader.onerror = () => reject(new Error('Error leyendo archivo'));
    reader.readAsDataURL(file); // Convierte la imagen a Base64 para guardarla offline
  })
};

  if(VIEWS.some(v=>v.id===hashView)) state.view = hashView;
  renderNav();
  render();

  // Suscribirse a los cambios de la base de datos local
  dbCap.doc('config/main').onSnapshot(async snap=>{
    if(!snap.exists){
      state.config = {numMesas:0, cocineros:2, estaciones:[{id:'general', nombre:'General'}], adminPin:'1234', mapaAssetId:null, mapaUrl:null};
      state.loaded.config = true;
      try{ await dbCap.doc('config/main').set(state.config); }catch(e){}
    } else {
      state.config = snap.data;
      state.loaded.config = true;
    }
    render();
  });

  dbCap.collection('mesas').orderBy('numero','asc').onSnapshot(snap=>{
    state.mesas = snap.docs.map(d=>({id:d.id, ...d.data}));
    state.loaded.mesas = true;
    render();
  });

  dbCap.collection('productos').onSnapshot(snap=>{
    state.productos = snap.docs.map(d=>({id:d.id, ...d.data}));
    state.loaded.productos = true;
    render();
  });

  dbCap.collection('pedidos').onSnapshot(snap=>{
    state.pedidos = snap.docs.map(d=>({id:d.id, ...d.data}));
    state.loaded.pedidos = true;
    render();
  });

  dbCap.collection('movimientosCaja').onSnapshot(snap=>{
    state.movimientosCaja = snap.docs.map(d=>({id:d.id, ...d.data}));
    state.loaded.movimientosCaja = true;
    render();
  });

  dbCap.doc('caja/main').onSnapshot(snap=>{
    state.caja = snap.exists ? snap.data : null;
    state.loaded.caja = true;

  });

  dbCap.collection('insumos').onSnapshot(snap=>{
    state.insumos = snap.docs.map(d=>({id:d.id, ...d.data}));

  dbCap.collection('movimientosInsumos').onSnapshot(snap=>{

  dbCap.collection('cierres').onSnapshot(snap=>{
    state.cierres = snap.docs.map(d=>({id:d.id, ...d.data}));

function vistaMapaActual(){

function mesaCardHtml(m){
  const ped = m.pedidoId ? state.pedidos.find(p=>p.id===m.pedidoId) : null;
  const cls = m.estado==='libre'?'st-libre': m.estado==='cuenta_pedida'?'st-cuenta':'st-ocupada';
  const label = m.estado==='libre'?'Libre': m.estado==='cuenta_pedida'?'Cuenta':'Ocupada';
  const mins = ped ? Math.max(0, Math.round((Date.now()-ped.creado)/60000)) : 0;
  const listos = ped ? (ped.items||[]).filter(it=>it.estado==='listo').length : 0;
  const tiempo = mins<60 ? mins+' min' : Math.floor(mins/60)+' h '+(mins%60)+' min';
  return `<button class="mesa-card ${cls}" data-mesa-card="${m.id}">
    <div class="mc-top"><span class="mc-num">${esc(m.numero)}</span><span class="mc-estado">${label}</span></div>
    <div class="mc-info">${ped ? esc(ped.mozoNombre||'Sin mozo')+' · '+(ped.personas||0)+' pers.' : 'Disponible'}</div>
    ${ped?`<div class="mc-info">${tiempo}${listos?` · <b class="mc-listo">${listos} para retirar</b>`:''}</div>`:''}
  </button>`;
}
function renderMapa(app){
  const vista = vistaMapaActual();

function mesaChipHtml(m){
  const cls = m.estado==='libre'?'st-libre': m.estado==='cuenta_pedida'?'st-cuenta':'st-ocupada';
  return `<div class="mesa-chip ${cls} ${state.adminMode?'draggable':''}" data-mesa-id="${m.id}" style="left:${m.x}%;top:${m.y}%">
    <div>${esc(m.numero)}</div><small>${m.estado==='libre'?'Libre':m.estado==='cuenta_pedida'?'Cuenta':'Ocupada'}</small>
  </div>`;
}
function makeDraggable(el, shell, mesa){
  let dragging=false, rect;
  el.addEventListener('pointerdown', (e)=>{
    dragging=true; el.setPointerCapture(e.pointerId); rect = shell.getBoundingClientRect(); el.dataset.dragged='0';
  });
  el.addEventListener('pointermove', (e)=>{
    if(!dragging) return;
    el.dataset.dragged='1';
    let x = ((e.clientX-rect.left)/rect.width)*100;
    let y = ((e.clientY-rect.top)/rect.height)*100;
    x = Math.max(2,Math.min(98,x)); y = Math.max(2,Math.min(96,y));
    el.style.left = x+'%'; el.style.top = y+'%';
  });
  el.addEventListener('pointerup', async (e)=>{
    dragging=false;
    if(el.dataset.dragged==='1'){
      const x = parseFloat(el.style.left), y = parseFloat(el.style.top);
      try{ await dbCap.doc('mesas/'+mesa.id).update({x,y}); }catch(err){ toast('No se pudo mover la mesa'); }
    }
  });
}
async function addMesaAt(e, shell, zonaId){
  const rect = shell.getBoundingClientRect();
  let x = ((e.clientX-rect.left)/rect.width)*100;
  let y = ((e.clientY-rect.top)/rect.height)*100;
  x = Math.max(4,Math.min(96,x)); y = Math.max(4,Math.min(94,y));
  const nextNum = (state.mesas.reduce((mx,m)=>Math.max(mx, Number(m.numero)||0),0)) + 1;
  try{
    await dbCap.collection('mesas').add({numero:nextNum, x, y, estado:'libre', pedidoId:null, zonaId: zonaId||null});
    await dbCap.doc('config/main').update({numMesas: state.mesas.length+1});
    toast('Mesa '+nextNum+' agregada');
  }catch(err){ toast('No se pudo crear la mesa'); }
}
function openMesaAdminMenu(m){
  const zonas = getZonas();
  openModal(`
    <h3>Mesa ${esc(m.numero)}</h3>

    ${zonas.length>1?`<div class="field" style="max-width:220px;margin-bottom:12px">
      <label>Zona</label>
      <select id="mAdminZona">${zonas.map(z=>`<option value="${z.id}" ${mesaZonaId(m)===z.id?'selected':''}>${esc(z.nombre)}</option>`).join('')}</select>
    </div>`:''}
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <button class="btn ghost" id="mAdminOpen">Abrir pedido</button>
      <button class="btn danger" id="mAdminDel" ${m.estado!=='libre'?'disabled':''}>Eliminar mesa</button>
    </div>
    ${m.estado!=='libre'?'<p class="section-sub" style="margin-top:8px">Solo se pueden eliminar mesas libres.</p>':''}

  if(zonas.length>1){
    document.getElementById('mAdminZona').onchange = async (e)=>{
      try{ await dbCap.doc('mesas/'+m.id).update({zonaId:e.target.value}); toast('Mesa reasignada de zona'); closeModal(); }
      catch(err){ toast('No se pudo cambiar la zona'); }
    };
  }
  document.getElementById('mAdminOpen').onclick = ()=>{ closeModal(); openMesaPanel(m); };

    if(m.estado!=='libre') return;
    if(!confirm('¿Eliminar la mesa '+m.numero+'?')) return;
    try{ await dbCap.doc('mesas/'+m.id).delete(); closeModal(); toast('Mesa eliminada'); }catch(e){ toast('No se pudo eliminar'); }
  };
}

/* ---- mesa order panel (mozo) ---- */
function openMesaPanel(m){
  if(m.estado==='libre'){
    openModal(`
      <h3>Abrir mesa ${esc(m.numero)}</h3>
      <p class="section-sub">Ingresá los datos iniciales para tomar el pedido.</p>
      <div class="field-row">
        <div class="field"><label>Personas</label><input type="number" min="1" value="2" id="fPersonas"></div>
        <div class="field"><label>Tenedores</label><input type="number" min="1" value="2" id="fTenedores"></div>
        ${(state.config.mozos||[]).length?`<div class="field"><label>Mozo</label><select id="fMozo">${mozoOptionsHtml(null)}</select></div>`:''}
      </div>
      <button class="btn" id="btnAbrir">Abrir mesa y tomar pedido</button>
    `);
    document.getElementById('btnAbrir').onclick = async ()=>{
      const personas = parseInt(document.getElementById('fPersonas').value)||1;
      const tenedores = parseInt(document.getElementById('fTenedores').value)||1;
      const fMozo = document.getElementById('fMozo');
      const mozoId = fMozo ? fMozo.value : '';
      const mozoNombre = mozoId ? ((state.config.mozos||[]).find(mz=>mz.id===mozoId)||{}).nombre : null;
      try{
        const ped = await dbCap.collection('pedidos').add({
          mesaId:m.id, mesaNumero:m.numero, personas, tenedores, items:[], estado:'abierto',
          creado: Date.now(), total:0, mozoId: mozoId||null, mozoNombre: mozoNombre||null
        });
        await dbCap.doc('mesas/'+m.id).update({estado:'ocupada', pedidoId: ped.id});
        closeModal();
        const freshMesa = {...m, estado:'ocupada', pedidoId: ped.id};
        setTimeout(()=>openMesaPanel(freshMesa), 250);
      }catch(err){ toast('No se pudo abrir la mesa'); }
    };
    return;
  }
  const pedido = state.pedidos.find(p=>p.id===m.pedidoId);
  if(!pedido){ toast('No se encontró el pedido de esta mesa'); return; }
  renderMesaOrderModal(m, pedido);
}
function renderMesaOrderModal(m, pedido){
  const items = pedido.items||[];
  const total = items.reduce((s,it)=>s+(it.precio*it.cantidad),0);
  openModal(`
    <h3>Mesa ${esc(m.numero)} ${m.estado==='cuenta_pedida'?'<span class="pill danger">Cuenta pedida</span>':''}</h3>
    <p class="section-sub">${pedido.personas} personas · ${pedido.tenedores} tenedores · abierta ${fmtTime(pedido.creado)}hs</p>
    ${(state.config.mozos||[]).length?`<div class="field" style="max-width:220px;margin-bottom:10px">
      <label>Mozo asignado</label>
      <select id="fMozoAsignado">${mozoOptionsHtml(pedido.mozoId)}</select>
    </div>`:''}
    <div style="display:flex;flex-direction:column;gap:8px;margin:12px 0">
      ${items.length===0? '<div class="empty">Sin ítems todavía. Agregá productos a la comanda.</div>' :
        items.map(it=>mesaItemRow(it, m)).join('')}
    </div>
    <div style="display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--line);padding-top:10px;margin-bottom:12px">
      <b>Total</b><b style="font-size:17px;color:var(--brand-2)">${fmtMoney(total)}</b>
    </div>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <button class="btn" id="btnAddItem">+ Agregar producto</button>
      ${m.estado!=='cuenta_pedida'?`<button class="btn ghost" id="btnPedirCuenta">Pedir cuenta</button>`:''}
      ${m.estado==='cuenta_pedida'?`<button class="btn gold" id="btnCobrar">Cobrar y cerrar</button>`:''}
      <button class="btn danger" id="btnCancelarPedido" style="margin-left:auto">Cancelar pedido</button>
    </div>
  `, {wide:true});
  document.getElementById('btnAddItem').onclick = ()=> openAddItemModal(m, pedido);
  const selMozo = document.getElementById('fMozoAsignado');
  if(selMozo) selMozo.onchange = async (e)=>{
    const mozoId = e.target.value;
    const mozoNombre = mozoId ? ((state.config.mozos||[]).find(mz=>mz.id===mozoId)||{}).nombre : null;
    try{ await dbCap.doc('pedidos/'+pedido.id).update({mozoId: mozoId||null, mozoNombre}); toast('Mozo actualizado'); }
    catch(err){ toast('No se pudo actualizar el mozo'); }
  };
  const bpc = document.getElementById('btnPedirCuenta');
  if(bpc) bpc.onclick = async ()=>{
    try{ await dbCap.doc('mesas/'+m.id).update({estado:'cuenta_pedida'}); closeModal(); toast('Cuenta pedida'); }
    catch(e){ toast('Error al pedir la cuenta'); }
  };
  const bco = document.getElementById('btnCobrar');
  if(bco) bco.onclick = ()=> openCobrarModal(m, pedido, total);
  document.getElementById('btnCancelarPedido').onclick = ()=> openCancelarPedidoModal(m, pedido);

  // entregar / avanzar item buttons
  document.querySelectorAll('[data-entregar]').forEach(btn=>{
    btn.onclick = async ()=>{
      const itemId = btn.dataset.entregar;
      const newItems = items.map(it=> it.id===itemId? {...it, estado:'entregado'} : it);
      try{ await dbCap.doc('pedidos/'+pedido.id).update({items:newItems}); }
      catch(e){ toast('No se pudo actualizar'); }
    };
  });
  document.querySelectorAll('[data-quitar]').forEach(btn=>{
    btn.onclick = async ()=>{
      if(m.estado==='cuenta_pedida' && !requireAdmin()) return;
      const itemId = btn.dataset.quitar;
      if(!confirm('¿Quitar este ítem de la comanda?')) return;
      const removed = items.find(it=>it.id===itemId);
      const newItems = items.filter(it=>it.id!==itemId);
      try{
        await dbCap.doc('pedidos/'+pedido.id).update({items:newItems});
        if(removed){ await restoreStock(removed.productoId, removed.cantidad); }
        renderMesaOrderModal(m, {...pedido, items:newItems});
      }catch(e){ toast('No se pudo quitar el ítem'); }
    };
  });
}
function mesaItemRow(it, m){
  const stColor = it.estado==='entregado'?'neutral':it.estado==='listo'?'ok':it.estado==='preparando'?'warn':'busy';
  const cuentaCerrada = m && m.estado==='cuenta_pedida';
  const puedeQuitar = it.estado==='pendiente' && (!cuentaCerrada || state.adminMode);
  return `<div class="mesa-item-row">
    <div>
      <div class="ticket-item">${it.cantidad}× ${esc(it.nombre)}</div>
      ${it.opcionesTexto? `<div class="ticket-opts">${esc(it.opcionesTexto)}</div>`:''}
      ${it.observaciones? `<div class="ticket-obs">"${esc(it.observaciones)}"</div>`:''}
    </div>
    <div style="display:flex;flex-direction:column;align-items:flex-end;gap:6px">
      <span class="pill ${stColor}">${ESTADO_LABEL[it.estado]}</span>
      <div style="display:flex;gap:4px">
        ${it.estado==='listo'?`<button class="btn sm" data-entregar="${it.id}">Entregar</button>`:''}
        ${puedeQuitar?`<button class="btn sm danger" data-quitar="${it.id}">Quitar</button>`:
          (it.estado==='pendiente' && cuentaCerrada?`<span class="pill neutral" title="La cuenta ya fue pedida — solo un administrador puede quitar ítems">Requiere admin</span>`:'')}
      </div>
    </div>
  </div>`;
}
/* ---- cancelar pedido completo (con motivo) ---- */
function openCancelarPedidoModal(m, pedido){
  if(!requireAdmin()) return;
  openModal(`
    <h3>Cancelar pedido — Mesa ${esc(m.numero)}</h3>
    <p class="section-sub">Esto libera la mesa y anula la comanda completa. El pedido queda guardado como cancelado en el historial, no se borra.</p>
    <div class="field"><label>Motivo</label><textarea id="fMotivoCancel" rows="2" placeholder="Ej: el cliente se retiró, error de carga..."></textarea></div>
    <button class="btn danger" id="btnConfirmarCancelar" style="margin-top:10px">Confirmar cancelación</button>
  `);
  document.getElementById('btnConfirmarCancelar').onclick = async ()=>{
    const motivo = document.getElementById('fMotivoCancel').value.trim();
    if(!motivo){ toast('El motivo es obligatorio'); return; }
    try{
      for(const it of (pedido.items||[])){
        if(it.estado!=='entregado') await restoreStock(it.productoId, it.cantidad);
      }
      await dbCap.doc('pedidos/'+pedido.id).update({estado:'cancelado', motivoCancelacion:motivo, canceladoEn:Date.now()});
      await dbCap.doc('mesas/'+m.id).update({estado:'libre', pedidoId:null});
      closeModal();
      toast('Pedido cancelado');
    }catch(e){ toast('No se pudo cancelar el pedido'); }
  };
}

/* ---- add item to comanda (with product options) ---- */

  const cats = [...new Set(activos.map(p=>p.categoria||'General'))];
  openModal(`

      </div>

    </div>
  `, {xwide:true});

    const texto = document.getElementById('fBuscarProd').value.trim().toLowerCase();

      (!texto || p.nombre.toLowerCase().includes(texto))

    document.getElementById('prodPickList').innerHTML = filtrados.map(p=>productPickRow(p)).join('') ||

  document.getElementById('fBuscarProd').oninput = aplicarFiltro;

    document.querySelectorAll('[data-pick]').forEach(btn=>{
      btn.onclick = ()=>{

        openConfigureItemModal(m, pedido, prod);

    });
  }

    let missingRequired = false;
    grupos.forEach(g=>{
      const groupEl = document.querySelector(`[data-group="${g.id}"]`);
      const sels = [...groupEl.querySelectorAll('.chip-toggle.sel')];
      if(g.obligatoria && sels.length===0) missingRequired = true;
      if(sels.length){
        optTextParts.push(g.nombre+': '+sels.map(s=>s.textContent.replace(/\s*\(\+.*\)$/,'')).join(', '));
        sels.forEach(s=> extra += parseFloat(s.dataset.price)||0);
      }
    });
    if(missingRequired){ toast('Completá las opciones obligatorias'); return; }
    const falta = faltantesPara(prod, cantidad);
    if(falta.length){
      const detalle = falta.map(f=>f.i.nombre+' (hay '+fmtQty(f.i.stock,f.i.unidad)+', hacen falta '+fmtQty(f.necesita,f.i.unidad)+')').join(', ');
      if(!(state.adminMode && confirm('Faltan insumos: '+detalle+'.\n\n¿Agregar igual? El inventario quedará en 0 para esos insumos.'))){ toast('Insumos insuficientes: '+detalle); return; }
    }
    const item = {
      id: uidLocal(), productoId: prod.id, nombre: prod.nombre, cantidad,
      precio: (prod.precio||0)+extra, opcionesTexto: optTextParts.join(' · '),
      observaciones, estado:'pendiente', estacionId: prod.estacionId||'general', creado: Date.now()
    };
    try{
      const newItems = [...(pedido.items||[]), item];
      await dbCap.doc('pedidos/'+pedido.id).update({items:newItems});
      await consumirReceta(prod, cantidad, 'Mesa '+m.numero+' · '+prod.nombre);
      toast('Producto agregado a la comanda');
      closeModal();
      setTimeout(()=>{
        const freshM = state.mesas.find(x=>x.id===m.id)||m;
        renderMesaOrderModal(freshM, {...pedido, items:newItems});
      }, 150);
    }catch(err){ toast('No se pudo agregar el producto'); }
  };
}

/* ---- cobrar ---- */
const MEDIOS_PAGO = ['Efectivo','Tarjeta débito','Tarjeta crédito','Transferencia','Otro'];
function openCobrarModal(m, pedido, total){
  let pagos = [{medio:'Efectivo', monto:total}];
  function pagosHtml(){
    const sumado = pagos.reduce((s,p)=>s+(parseFloat(p.monto)||0),0);
    return `
      <div id="pagosWrap" style="display:flex;flex-direction:column;gap:8px">
        ${pagos.map((p,i)=>`<div class="field-row" data-pi="${i}" style="align-items:flex-end">
          <div class="field"><label>Medio de pago</label><select class="pg-medio">${MEDIOS_PAGO.map(mp=>`<option ${mp===p.medio?'selected':''}>${mp}</option>`).join('')}</select></div>
          <div class="field"><label>Monto</label><input type="number" min="0" class="pg-monto" value="${p.monto}"></div>
          ${pagos.length>1?`<button class="iconbtn" data-delpago="${i}">✕</button>`:''}
        </div>`).join('')}
      </div>
      <div style="display:flex;justify-content:space-between;margin-top:10px;font-size:13.5px">
        <span class="section-sub" style="margin:0">Ingresado: <b style="color:var(--ink)">${fmtMoney(sumado)}</b> / ${fmtMoney(total)}</span>
        ${sumado!==total?`<span style="color:var(--warn);font-weight:700">${sumado>total?'Sobra':'Falta'} ${fmtMoney(Math.abs(sumado-total))}</span>`:''}
      </div>
      <button class="btn sm ghost" id="btnAddPago" style="margin-top:8px">+ Dividir en otro medio de pago</button>
    `;
  }
  openModal(`
    <h3>Cobrar mesa ${esc(m.numero)}</h3>
    <p class="section-sub">Carga manual del pago. Total de la comanda: <b>${fmtMoney(total)}</b>. Podés dividirlo en más de un medio de pago.</p>
    <div id="pagosBox">${pagosHtml()}</div>
    <button class="btn gold" id="btnConfirmarCobro" style="margin-top:14px">Confirmar cobro y cerrar mesa</button>
  `);
  function readPagosFromDOM(){
    document.querySelectorAll('#pagosWrap [data-pi]').forEach(el=>{
      const i = parseInt(el.dataset.pi);
      pagos[i].medio = el.querySelector('.pg-medio').value;
      pagos[i].monto = parseFloat(el.querySelector('.pg-monto').value)||0;
    });
  }
  function rebind(){
    document.getElementById('pagosBox').innerHTML = pagosHtml();
    document.getElementById('btnAddPago').onclick = ()=>{
      readPagosFromDOM();
      const sumado = pagos.reduce((s,p)=>s+(parseFloat(p.monto)||0),0);
      pagos.push({medio:'Efectivo', monto: Math.max(0, total-sumado)});
      rebind();
    };
    document.querySelectorAll('[data-delpago]').forEach(b=>b.onclick=()=>{
      readPagosFromDOM();
      pagos.splice(parseInt(b.dataset.delpago),1);
      rebind();
    });
  }
  rebind();
  document.getElementById('btnConfirmarCobro').onclick = async ()=>{
    readPagosFromDOM();
    const montoTotal = pagos.reduce((s,p)=>s+(parseFloat(p.monto)||0),0);
    if(montoTotal<=0){ toast('Ingresá al menos un monto mayor a 0'); return; }
    const mediosUnicos = [...new Set(pagos.map(p=>p.medio))];
    const medioPago = mediosUnicos.length>1 ? 'Mixto' : mediosUnicos[0];
    try{
      await dbCap.doc('pedidos/'+pedido.id).update({estado:'cerrado', total: montoTotal, medioPago, pagos, cerrado: Date.now()});
      await dbCap.doc('mesas/'+m.id).update({estado:'libre', pedidoId:null});
      closeModal();
      toast('Mesa cobrada y cerrada');
    }catch(e){ toast('No se pudo cerrar la cuenta'); }
  };
}

/* ================= COCINA ================= */
function renderCocina(app){
  if(state.rol==='mozo') return renderCocinaMozo(app);
  const estaciones = (state.config.estaciones||[]);
  if(!state.ui.stationTab && estaciones[0]) state.ui.stationTab = estaciones[0].id;
  const abiertos = state.pedidos.filter(p=>p.estado==='abierto');
  const allItems = [];
  abiertos.forEach(p=>{
    (p.items||[]).forEach(it=>{
      if(it.estado!=='entregado') allItems.push({...it, mesaNumero:p.mesaNumero, pedidoId:p.id, mozoNombre:p.mozoNombre, mozoId:p.mozoId||null});
    });
  });
  const filtered = allItems.filter(it=>(it.estacionId||'general')===state.ui.stationTab).sort((a,b)=>a.creado-b.creado);

  app.innerHTML = `
    <h2 class="section-title">Cocina</h2>
    <p class="section-sub">${state.config.cocineros||0} cocinero(s) en turno · ${estaciones.length} estación(es)</p>
    <div class="stationbar">
      ${estaciones.map(e=>`<button data-st="${e.id}" class="${state.ui.stationTab===e.id?'active':''}">${esc(e.nombre)} <span class="badge-count">${allItems.filter(it=>(it.estacionId||'general')===e.id).length}</span></button>`).join('')}
    </div>
    <div class="grid-4 tickets" id="ticketGrid">
      ${filtered.length===0? '<div class="empty" style="grid-column:1/-1"><b>Sin comandas pendientes</b>Los pedidos de esta estación aparecerán acá en tiempo real.</div>' :
        filtered.map(it=>ticketCardHtml(it)).join('')}
    </div>
  `;
  document.querySelectorAll('.stationbar button').forEach(b=>b.onclick=()=>{ state.ui.stationTab=b.dataset.st; render(); });
  bindTicketActions();
}
// Botones de los tickets (avanzar estado / marcar retirado), compartidos por la vista de cocina y la del mozo.
function bindTicketActions(){
  document.querySelectorAll('[data-advance]').forEach(btn=>{
    btn.onclick = async ()=>{
      const [pedidoId,itemId] = btn.dataset.advance.split('|');
      const pedido = state.pedidos.find(p=>p.id===pedidoId);
      if(!pedido) return;
      const idx = ESTADOS_ITEM.indexOf((pedido.items.find(i=>i.id===itemId)||{}).estado);
      const nextEstado = ESTADOS_ITEM[Math.min(idx+1, ESTADOS_ITEM.length-2)]; // kitchen won't set 'entregado'
      const newItems = pedido.items.map(it=> it.id===itemId? {...it, estado:nextEstado}: it);
      try{ await dbCap.doc('pedidos/'+pedidoId).update({items:newItems}); }catch(e){ toast('Error al actualizar'); }
    };
  });
  document.querySelectorAll('[data-retirar]').forEach(btn=>{
    btn.onclick = async ()=>{
      const [pedidoId,itemId] = btn.dataset.retirar.split('|');
      const pedido = state.pedidos.find(p=>p.id===pedidoId);
      if(!pedido) return;
      const newItems = pedido.items.map(it=> it.id===itemId? {...it, estado:'entregado'}: it);
      try{ await dbCap.doc('pedidos/'+pedidoId).update({items:newItems}); toast('Ítem retirado'); }
      catch(e){ toast('Error al actualizar'); }
    };
  });
}
/* Cocina para el rol Mozo: filtro por mozo, sección "Listos para retirar" y comandas en cocina agrupadas por mozo */
function renderCocinaMozo(app){
  const estaciones = (state.config.estaciones||[]);
  if(!state.ui.stationTab && estaciones[0]) state.ui.stationTab = estaciones[0].id;
  const mozosCfg = (state.config.mozos||[]);
  const items = [];
  state.pedidos.filter(p=>p.estado==='abierto').forEach(p=>(p.items||[]).forEach(it=>{
    if(it.estado!=='entregado') items.push({...it, mesaNumero:p.mesaNumero, pedidoId:p.id, mozoNombre:p.mozoNombre, mozoId:p.mozoId||null});
  }));
  const claveMozo = it => it.mozoId && mozosCfg.some(m=>m.id===it.mozoId) ? it.mozoId : 'sin';
  const nombreMozo = k => k==='sin' ? 'Sin asignar' : (mozosCfg.find(m=>m.id===k)||{}).nombre || 'Sin asignar';
  const hayModoSin = items.some(it=>claveMozo(it)==='sin');
  const opciones = [...mozosCfg.map(m=>m.id), ...(hayModoSin?['sin']:[])];

  if(state.ui.cocinaMozo==null){ try{ state.ui.cocinaMozo = localStorage.getItem('restaurantFlowCocinaMozo') || 'todos'; }catch(e){ state.ui.cocinaMozo = 'todos'; } }
  if(state.ui.cocinaMozo!=='todos' && !opciones.includes(state.ui.cocinaMozo)) state.ui.cocinaMozo = 'todos';
  const sel = state.ui.cocinaMozo;
  const delMozo = it => sel==='todos' || claveMozo(it)===sel;

  const listos = items.filter(it=>it.estado==='listo' && delMozo(it)).sort((a,b)=>a.creado-b.creado);
  const enCocina = items.filter(it=>it.estado!=='listo' && delMozo(it));
  const enEstacion = enCocina.filter(it=>(it.estacionId||'general')===state.ui.stationTab).sort((a,b)=>a.creado-b.creado);
  const nListos = k => items.filter(it=>it.estado==='listo' && (k==='todos'||claveMozo(it)===k)).length;

  // agrupa por mozo (solo cuando se ven todos los mozos) respetando el orden de la lista de mozos
  const agrupar = lista => {
    if(sel!=='todos') return [[sel, lista]];
    return [...mozosCfg.map(m=>m.id), 'sin'].map(k=>[k, lista.filter(it=>claveMozo(it)===k)]).filter(([,l])=>l.length);
  };
  const bloques = (lista, listoCard) => agrupar(lista).map(([k,l])=>`
    ${sel==='todos'?`<div class="mozo-grupo"><i class="fa-solid fa-user"></i> ${esc(nombreMozo(k))} <span class="badge-count">${l.length}</span></div>`:''}
    <div class="grid-4 tickets ${listoCard?'listos':''}">${l.map(it=>ticketCardHtml(it)).join('')}</div>`).join('');

  app.innerHTML = `
    <h2 class="section-title">Cocina</h2>
    <p class="section-sub">Elegí tu nombre para ver solo tus mesas, o todos los mozos agrupados.</p>
    <div class="mozo-filtro">
      <span class="mozo-filtro-label"><i class="fa-solid fa-user"></i> Mozo</span>
      <div class="mesa-filtros" style="margin:0">
        ${[['todos','Todos'], ...opciones.map(k=>[k, nombreMozo(k)])].map(([k,l])=>`<button data-cmozo="${k}" class="${sel===k?'on':''}">${esc(l)}${nListos(k)?` <span class="badge-count" style="background:var(--ok-bg);color:var(--ok)" title="Listos para retirar">${nListos(k)}</span>`:''}</button>`).join('')}
      </div>
    </div>

    <h3 class="seccion-retirar"><i class="fa-solid fa-bell-concierge"></i> Listos para retirar <span class="badge-count" style="background:var(--ok-bg);color:var(--ok)">${listos.length}</span></h3>
    ${listos.length===0 ? `<div class="card empty" style="padding:18px;margin-bottom:18px"><b>Nada para retirar por ahora</b>Cuando cocina marque un ítem como listo, aparece acá.</div>` : `<div style="margin-bottom:22px">${bloques(listos, true)}</div>`}

    <h3 class="seccion-retirar"><i class="fa-solid fa-fire-burner"></i> En cocina <span class="badge-count">${enCocina.length}</span></h3>
    <div class="stationbar">
      ${estaciones.map(e=>`<button data-st="${e.id}" class="${state.ui.stationTab===e.id?'active':''}">${esc(e.nombre)} <span class="badge-count">${enCocina.filter(it=>(it.estacionId||'general')===e.id).length}</span></button>`).join('')}
    </div>
    ${enEstacion.length===0 ? '<div class="empty"><b>Sin comandas en esta estación</b>'+(sel==='todos'?'Los pedidos en preparación aparecerán acá.':'No hay pedidos de '+esc(nombreMozo(sel))+' en preparación en esta estación.')+'</div>' : bloques(enEstacion, false)}
  `;
  document.querySelectorAll('[data-cmozo]').forEach(b=>b.onclick=()=>{
    state.ui.cocinaMozo = b.dataset.cmozo;
    try{ localStorage.setItem('restaurantFlowCocinaMozo', b.dataset.cmozo); }catch(e){}
    render();
  });
  document.querySelectorAll('.stationbar button').forEach(b=>b.onclick=()=>{ state.ui.stationTab=b.dataset.st; render(); });
  bindTicketActions();
}
function ticketCardHtml(it){
  const stColor = it.estado==='listo'?'ok':it.estado==='preparando'?'warn':'busy';
  const puedeAvanzar = it.estado!=='listo' && (state.rol==='cocina' || state.rol==='admin');
  const puedeRetirar = it.estado==='listo' && (state.rol==='mozo' || state.rol==='admin');
  return `<div class="ticket">
    <div class="ticket-head"><span class="ticket-mesa">Mesa ${esc(it.mesaNumero)}${it.mozoNombre?` <span class="ticket-mozo">· ${esc(it.mozoNombre)}</span>`:''}</span><span class="ticket-time">${fmtTime(it.creado)}</span></div>
    <div class="ticket-item">${it.cantidad}× ${esc(it.nombre)}</div>
    ${it.opcionesTexto?`<div class="ticket-opts">${esc(it.opcionesTexto)}</div>`:''}
    ${it.observaciones?`<div class="ticket-obs">"${esc(it.observaciones)}"</div>`:''}
    <span class="pill ${stColor}" style="align-self:flex-start">${ESTADO_LABEL[it.estado]}</span>
    <div class="ticket-actions">
      ${puedeAvanzar?`<button class="btn sm" data-advance="${it.pedidoId}|${it.id}">${it.estado==='pendiente'?'Empezar a preparar':'Marcar listo'}</button>`:
        puedeRetirar?`<button class="btn sm gold" data-retirar="${it.pedidoId}|${it.id}">Retirado ✓</button>`:
        it.estado==='listo'?'<span class="pill neutral">Esperando al mozo</span>':
        '<span class="pill neutral">A cargo de cocina</span>'}
    </div>
  </div>`;
}

/* ================= INVENTARIO (insumos, recetas, compras y costos) ================= */
const UNIDADES = ['kg','g','l','ml','un'];
const TIPO_MOV_LABEL = {compra:'Compra', consumo:'Consumo por venta', anulacion:'Anulación', merma:'Merma', ajuste:'Conteo / ajuste', inicial:'Stock inicial'};
const TIPO_MOV_CLASS = {compra:'ok', consumo:'busy', anulacion:'neutral', merma:'danger', ajuste:'warn', inicial:'neutral'};
const MOTIVOS_MERMA = ['Vencido / en mal estado','Se cayó o se derramó','Error de cocina','Cortesía o degustación','Otro'];
const INV_TABS = [['insumos','Insumos'],['compras','Compras'],['costos','Costos y margen'],['movimientos','Movimientos']];

function redondear(n, d){ const f = Math.pow(10, d==null?3:d); return Math.round((Number(n)||0)*f)/f; }
function fmtQty(n, unidad){ return redondear(n,3).toLocaleString('es-AR',{maximumFractionDigits:3})+' '+(unidad||''); }
function fmtDM(ts){ const d = new Date(ts); return String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0')+' '+fmtTime(ts); }
function insumoPorId(id){ return state.insumos.find(i=>i.id===id); }
function estadoInsumo(i){ const s = i.stock||0; if(s<=0) return 'agotado'; if((i.minimo||0)>0 && s<=i.minimo) return 'bajo'; return 'ok'; }
function pillEstadoInsumo(i){
  const e = estadoInsumo(i);
  return e==='agotado' ? '<span class="pill danger">Agotado</span>' : e==='bajo' ? '<span class="pill warn">Bajo mínimo</span>' : '<span class="pill ok">OK</span>';
}
function costoReceta(prod){
  return (prod.receta||[]).reduce((t,r)=>{ const i = insumoPorId(r.insumoId); return t + (i ? (i.costo||0)*(r.cantidad||0) : 0); },0);
}
// Cuántas porciones se pueden preparar con el stock actual (null si el producto no tiene receta).
function porcionesPosibles(prod){
  let min = Infinity;
  (prod.receta||[]).forEach(r=>{
    const i = insumoPorId(r.insumoId);
    if(i && r.cantidad>0) min = Math.min(min, Math.floor((i.stock||0)/r.cantidad + 1e-9));
  });
  return min===Infinity ? null : min;
}
function faltantesPara(prod, cantidad){
  return (prod.receta||[]).map(r=>({i:insumoPorId(r.insumoId), necesita:(r.cantidad||0)*cantidad}))
    .filter(x=>x.i && (x.i.stock||0) < x.necesita - 1e-9);
}
// Costo (estimado, con el costo actual de cada insumo) de lo vendido en una lista de pedidos cerrados.
function costoVendido(pedidos){
  let costo = 0, sinReceta = 0;
  pedidos.forEach(p=>(p.items||[]).forEach(it=>{
    const prod = state.productos.find(x=>x.id===it.productoId);
    if(prod && (prod.receta||[]).length) costo += costoReceta(prod)*(it.cantidad||0); else sinReceta += (it.cantidad||0);
  }));
  return {costo, sinReceta};
}

// Mueve el stock de un insumo y deja registro. delta > 0 suma, delta < 0 resta (nunca baja de 0).
async function moverInsumo(insumoId, tipo, delta, motivo, extra){
  extra = extra || {};
  const ins = insumoPorId(insumoId);
  if(!ins) return;
  const actual = ins.stock||0;
  const nuevo = redondear(Math.max(0, actual + delta));
  const upd = {stock:nuevo};
  if(extra.costoNuevo!=null) upd.costo = extra.costoNuevo;
  await dbCap.doc('insumos/'+insumoId).update(upd);
  await dbCap.collection('movimientosInsumos').add({
    insumoId, insumoNombre:ins.nombre, unidad:ins.unidad, tipo, delta:redondear(nuevo-actual), motivo:motivo||'',
    costoUnit: extra.costoUnit!=null ? extra.costoUnit : (ins.costo||0),
    total: extra.total!=null ? extra.total : null, proveedor: extra.proveedor||'', creado: Date.now()
  });
}
// Al cargar un producto en una comanda: descuenta los insumos de su receta.
async function consumirReceta(prod, cantidad, motivo){
  for(const r of (prod.receta||[])){
    if(insumoPorId(r.insumoId)) await moverInsumo(r.insumoId, 'consumo', -(r.cantidad*cantidad), motivo);
  }
}
// Al quitar un ítem o anular una comanda: devuelve los insumos.
async function restoreStock(productoId, cantidad){
  const prod = state.productos.find(p=>p.id===productoId);
  if(!prod) return;
  for(const r of (prod.receta||[])){
    if(insumoPorId(r.insumoId)) await moverInsumo(r.insumoId, 'anulacion', r.cantidad*cantidad, 'Ítem quitado de la comanda');
  }
}

  });
  document.querySelectorAll('[data-copiar]').forEach(b=>b.onclick=()=>{
    const prov = provs[+b.dataset.copiar];
    const txt = 'Pedido para '+prov+'\n'+grupos[prov].map(x=>'- '+x.i.nombre+': '+fmtQty(x.sug,x.i.unidad)).join('\n');
    copiarTexto(txt);
  });
}
function copiarTexto(txt){
  const fallback = ()=>{
    const ta = document.createElement('textarea'); ta.value = txt; document.body.appendChild(ta); ta.select();
    try{ document.execCommand('copy'); toast('Pedido copiado'); }catch(e){ toast('No se pudo copiar'); }
    ta.remove();
  };
  if(navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(txt).then(()=>toast('Pedido copiado'), fallback);
  else fallback();
}

/* ---- modales ---- */
function openCompraModal(preset){
  preset = preset || {};
  const insumos = state.insumos.filter(i=>i.activo!==false).sort((a,b)=>a.nombre.localeCompare(b.nombre));
  if(!insumos.length){ toast('Primero cargá insumos'); return; }
  let lineas = (preset.lineas && preset.lineas.length ? preset.lineas : [{insumoId:preset.insumoId||insumos[0].id, cantidad:''}])
    .map(l=>({insumoId:l.insumoId, cantidad:l.cantidad, costo:(insumoPorId(l.insumoId)||{}).costo||0}));
  const proveedores = [...new Set(state.insumos.map(i=>i.proveedor).filter(Boolean))];
  openModal(`
    <h3>Registrar compra</h3>
    <p class="section-sub">Suma los insumos al inventario y actualiza su costo promedio con el precio de esta compra.</p>
    <div class="field"><label>Proveedor</label><input id="cProveedor" list="listaProv" value="${esc(preset.proveedor||'')}" placeholder="Opcional"><datalist id="listaProv">${proveedores.map(p=>`<option value="${esc(p)}">`).join('')}</datalist></div>
    <div id="lineasWrap"></div>
    <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-top:6px">
      <button class="btn sm ghost" id="btnAddLinea">+ Agregar insumo</button>
      <span class="section-sub" style="margin:0">Total: <b id="compraTotal" style="color:var(--ink)">$0</b></span>
    </div>
    <button class="btn gold" id="btnGuardarCompra" style="margin-top:14px">Guardar compra</button>
  `, {wide:true});
  const wrap = document.getElementById('lineasWrap');
  function leer(){
    wrap.querySelectorAll('[data-li]').forEach(el=>{
      const i = +el.dataset.li;
      lineas[i].insumoId = el.querySelector('.l-ins').value;
      lineas[i].cantidad = el.querySelector('.l-cant').value;
      lineas[i].costo = parseFloat(el.querySelector('.l-costo').value)||0;
    });
  }
  function total(){ leer(); const t = lineas.reduce((s,l)=>s+(parseFloat(l.cantidad)||0)*(l.costo||0),0); document.getElementById('compraTotal').textContent = fmtMoney(t); }
  function pintar(){
    wrap.innerHTML = lineas.map((l,i)=>{
      const ins = insumoPorId(l.insumoId)||{};
      return `<div class="field-row" data-li="${i}" style="align-items:flex-end">
        <div class="field" style="flex:2"><label>Insumo</label><select class="l-ins">${insumos.map(x=>`<option value="${x.id}" ${x.id===l.insumoId?'selected':''}>${esc(x.nombre)} (${esc(x.unidad)})</option>`).join('')}</select></div>
        <div class="field" style="max-width:120px"><label>Cantidad (${esc(ins.unidad||'')})</label><input type="number" min="0" step="any" class="l-cant" value="${l.cantidad}"></div>
        <div class="field" style="max-width:130px"><label>Costo unit. $</label><input type="number" min="0" step="any" class="l-costo" value="${l.costo}"></div>
        ${lineas.length>1?`<button class="iconbtn" data-dell="${i}">✕</button>`:''}</div>`;
    }).join('');
    wrap.querySelectorAll('.l-ins').forEach(s=>s.onchange=()=>{ leer(); const i = +s.closest('[data-li]').dataset.li; lineas[i].costo = (insumoPorId(lineas[i].insumoId)||{}).costo||0; pintar(); });
    wrap.querySelectorAll('.l-cant,.l-costo').forEach(inp=>inp.oninput=total);
    wrap.querySelectorAll('[data-dell]').forEach(b=>b.onclick=()=>{ leer(); lineas.splice(+b.dataset.dell,1); pintar(); });
    total();
  }
  pintar();
  document.getElementById('btnAddLinea').onclick = ()=>{ leer(); lineas.push({insumoId:insumos[0].id, cantidad:'', costo:insumos[0].costo||0}); pintar(); };
  document.getElementById('btnGuardarCompra').onclick = async ()=>{
    leer();
    const validas = lineas.filter(l=>(parseFloat(l.cantidad)||0)>0);
    if(!validas.length){ toast('Cargá la cantidad de al menos un insumo'); return; }
    const prov = document.getElementById('cProveedor').value.trim();
    let totalGeneral = 0;
    try{
      for(const l of validas){
        const ins = insumoPorId(l.insumoId); if(!ins) continue;
        const cant = parseFloat(l.cantidad), cu = l.costo||0, stock = ins.stock||0;
        const costoNuevo = (stock+cant)>0 ? redondear((stock*(ins.costo||0) + cant*cu)/(stock+cant), 2) : cu;
        totalGeneral += cant*cu;
        await moverInsumo(l.insumoId, 'compra', cant, 'Compra'+(prov?' · '+prov:''), {costoUnit:cu, total:cant*cu, proveedor:prov, costoNuevo});
      }
      closeModal(); toast('Compra registrada: '+fmtMoney(totalGeneral));
    }catch(e){ toast('No se pudo registrar la compra'); }
  };
}

    <p class="section-sub">Stock según el sistema: <b>${fmtQty(ins.stock,ins.unidad)}</b>. Ingresá lo que realmente hay y el sistema registra la diferencia.</p>

    <button class="btn" id="btnGuardarConteo" style="margin-top:10px">Guardar conteo</button>
  `);
  document.getElementById('btnGuardarConteo').onclick = async ()=>{
    const real = parseFloat(document.getElementById('cReal').value);
    if(isNaN(real) || real<0){ toast('Ingresá un stock válido'); return; }
    const delta = redondear(real-(ins.stock||0));
    if(delta===0){ closeModal(); toast('Sin diferencias'); return; }
    try{ await moverInsumo(ins.id, 'ajuste', delta, document.getElementById('cMotivo').value.trim()||'Conteo físico'); closeModal(); toast('Conteo guardado'); }
    catch(e){ toast('No se pudo guardar el conteo'); }
  };
}

      <div class="field" style="max-width:130px"><label>Activo</label><select id="iActivo"><option value="1" ${ins.activo!==false?'selected':''}>Sí</option><option value="0" ${ins.activo===false?'selected':''}>No</option></select></div>

    </div>
  `);
  const del = document.getElementById('btnDelInsumo');

    const usado = state.productos.filter(p=>(p.receta||[]).some(r=>r.insumoId===ins.id));
    if(usado.length){ toast('No se puede eliminar: lo usan '+usado.length+' receta(s) ('+usado.slice(0,3).map(p=>p.nombre).join(', ')+')'); return; }
    if(!confirm('¿Eliminar este insumo? El historial de movimientos se conserva.')) return;
    try{ await dbCap.doc('insumos/'+ins.id).delete(); closeModal(); toast('Insumo eliminado'); }catch(e){ toast('Error al eliminar'); }
  };
  document.getElementById('btnSaveInsumo').onclick = async ()=>{
    const nombre = document.getElementById('iNombre').value.trim();
    if(!nombre){ toast('El nombre es obligatorio'); return; }
    if(state.insumos.some(i=>i.id!==ins.id && i.nombre.toLowerCase()===nombre.toLowerCase())){ toast('Ya existe un insumo con ese nombre'); return; }
    const data = {
      nombre, rubro:document.getElementById('iRubro').value.trim(), unidad:document.getElementById('iUnidad').value,
      costo:parseFloat(document.getElementById('iCosto').value)||0, minimo:parseFloat(document.getElementById('iMinimo').value)||0,
      ideal:parseFloat(document.getElementById('iIdeal').value)||0, proveedor:document.getElementById('iProveedor').value.trim(),
      activo:document.getElementById('iActivo').value==='1'
    };
    try{
      if(isNew){
        const stock = parseFloat(document.getElementById('iStock').value)||0;
        const ref = await dbCap.collection('insumos').add({...data, stock:0});
        if(stock>0) await moverInsumo(ref.id, 'inicial', stock, 'Stock inicial');

        await dbCap.doc('insumos/'+ins.id).update(data);
      }
      closeModal(); toast('Insumo guardado');
    }catch(e){ toast('No se pudo guardar el insumo'); }
  };
}


/* ================= CAJA ================= */
function renderCaja(app){
  const today = todayStr();
  const cfg = state.caja;
  const cajaAbiertaHoy = !!(cfg && cfg.abierta && cfg.fecha===today);
  const cajaCerradaHoy = !!(cfg && !cfg.abierta && cfg.fecha===today);

  if(!cajaAbiertaHoy && !cajaCerradaHoy){
    app.innerHTML = `
      <h2 class="section-title">Caja</h2>
      <p class="section-sub">Todavía no se abrió la caja de hoy. Ingresá el monto inicial para empezar a operar.</p>
      <div class="card" style="max-width:360px;padding:18px">
        <div class="field"><label>Monto inicial</label><input type="number" min="0" value="0" id="fMontoInicial"></div>
        <button class="btn gold" id="btnAbrirCaja" style="margin-top:12px">Abrir caja</button>
      </div>
    `;
    document.getElementById('btnAbrirCaja').onclick = async ()=>{
      const montoInicial = parseFloat(document.getElementById('fMontoInicial').value)||0;
      try{
        await dbCap.doc('caja/main').set({abierta:true, fecha:today, montoInicial, abiertaEn:Date.now(), cerradaEn:null, montoRealCierre:null, diferencia:null});
        toast('Caja abierta');
      }catch(e){ toast('No se pudo abrir la caja'); }
    };
    return;
  }

  const pendientes = state.mesas.filter(m=>m.estado!=='libre').map(m=>{
    const pedido = state.pedidos.find(p=>p.id===m.pedidoId);
    const total = pedido? (pedido.items||[]).reduce((s,it)=>s+it.precio*it.cantidad,0):0;
    return {mesa:m, pedido, total};
  });
  const ventasHoy = state.pedidos.filter(p=>p.estado==='cerrado' && dateOf(p.cerrado)===today);
  const totalVentasHoy = ventasHoy.reduce((s,p)=>s+(p.total||0),0);
  const movHoy = state.movimientosCaja.filter(mv=>dateOf(mv.creado)===today);
  const ingresosManuales = movHoy.filter(mv=>mv.tipo==='ingreso').reduce((s,mv)=>s+mv.monto,0);
  const egresosManuales = movHoy.filter(mv=>mv.tipo==='egreso').reduce((s,mv)=>s+mv.monto,0);
  const totalEsperado = (cfg.montoInicial||0) + totalVentasHoy + ingresosManuales - egresosManuales;

  app.innerHTML = `
    <div style="display:flex;justify-content:space-between;align-items:flex-end;gap:10px;flex-wrap:wrap">
      <div><h2 class="section-title">Caja</h2><p class="section-sub">Carga manual de pagos por mesa. Cerrar una cuenta libera la mesa.</p></div>
      ${cajaAbiertaHoy?`<button class="btn gold" id="btnCerrarCaja">Cerrar caja</button>`:
        `<span class="pill ${cfg.diferencia===0?'ok':'warn'}">Caja cerrada · contado ${fmtMoney(cfg.montoRealCierre||0)} · diferencia ${fmtMoney(cfg.diferencia||0)}</span>`}
    </div>
    <div class="grid-cards" style="margin:14px 0">
      <div class="card" style="padding:14px"><div class="prod-meta">Monto inicial</div><div class="prod-price" style="font-size:20px">${fmtMoney(cfg.montoInicial)}</div></div>

function openNuevoMovimientoModal(){
  openModal(`
    <h3>Nuevo movimiento de caja</h3>
    <div class="field-row">
      <div class="field"><label>Tipo</label><select id="mvTipo"><option value="ingreso">Ingreso</option><option value="egreso">Egreso</option></select></div>
      <div class="field"><label>Medio de pago</label><select id="mvMedio"><option>Efectivo</option><option>Tarjeta</option><option>Transferencia</option><option>Otro</option></select></div>
    </div>
    <div class="field"><label>Concepto</label><input id="mvConcepto" placeholder="Ej: cambio inicial, retiro parcial..."></div>
    <div class="field"><label>Monto</label><input type="number" min="0" value="0" id="mvMonto"></div>
    <button class="btn" id="btnGuardarMov" style="margin-top:10px">Guardar movimiento</button>
  `);
  document.getElementById('btnGuardarMov').onclick = async ()=>{
    const tipo = document.getElementById('mvTipo').value;
    const medioPago = document.getElementById('mvMedio').value;
    const concepto = document.getElementById('mvConcepto').value.trim();
    const monto = parseFloat(document.getElementById('mvMonto').value)||0;
    if(!concepto){ toast('El concepto es obligatorio'); return; }
    if(monto<=0){ toast('El monto debe ser mayor a 0'); return; }
    try{
      await dbCap.collection('movimientosCaja').add({tipo, medioPago, concepto, monto, creado:Date.now()});
      closeModal(); toast('Movimiento registrado');
    }catch(e){ toast('No se pudo registrar el movimiento'); }
  };
}
function openCerrarCajaModal(totalEsperado){
  openModal(`
    <h3>Cerrar caja</h3>
    <p class="section-sub">Total esperado según el sistema: <b>${fmtMoney(totalEsperado)}</b>. Contá el efectivo real y cargalo abajo.</p>
    <div class="field"><label>Monto real contado</label><input type="number" min="0" value="${totalEsperado}" id="fMontoReal"></div>
    <button class="btn gold" id="btnConfirmarCierreCaja" style="margin-top:10px">Confirmar cierre de caja</button>
  `);
  document.getElementById('btnConfirmarCierreCaja').onclick = async ()=>{
    const montoReal = parseFloat(document.getElementById('fMontoReal').value)||0;
    const diferencia = Math.round((montoReal - totalEsperado)*100)/100;
    try{
      await dbCap.doc('caja/main').update({abierta:false, cerradaEn:Date.now(), montoRealCierre:montoReal, diferencia});
      closeModal();
      toast(diferencia===0? 'Caja cerrada sin diferencias' : `Caja cerrada. Diferencia: ${fmtMoney(diferencia)}`);
    }catch(e){ toast('No se pudo cerrar la caja'); }
  };
}

/* ================= CIERRE ================= */
function renderCierre(app){
  const fecha = state.ui.cierreDate;
  const cerrados = state.pedidos.filter(p=>p.estado==='cerrado' && dateOf(p.cerrado)===fecha);
  const cancelados = state.pedidos.filter(p=>p.estado==='cancelado' && dateOf(p.canceladoEn)===fecha);
  const totalVentas = cerrados.reduce((s,p)=>s+(p.total||0),0);
  const totalPersonas = cerrados.reduce((s,p)=>s+(p.personas||0),0);
  const totalTenedores = cerrados.reduce((s,p)=>s+(p.tenedores||0),0);
  const productoAgg = {};
  cerrados.forEach(p=>(p.items||[]).forEach(it=>{
    productoAgg[it.nombre] = (productoAgg[it.nombre]||0) + it.cantidad;
  }));
  const aggList = Object.entries(productoAgg).sort((a,b)=>b[1]-a[1]);
  const cajaDelDia = (state.caja && state.caja.fecha===fecha) ? state.caja : null;
  const confirmado = cierreConfirmado(fecha);
  const costoDia = {...costoVendido(cerrados), tiene: state.insumos.length>0 && state.productos.some(p=>(p.receta||[]).length>0)};

  app.innerHTML = `
    <div style="display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:10px">
      <div><h2 class="section-title">Cierre del día</h2><p class="section-sub">Ventas, productos vendidos, personas y cubiertos.</p></div>
      <div style="display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap">
        <div class="field"><label>Fecha</label><input type="date" id="fFecha" value="${fecha}"></div>
        <button class="btn ghost" id="btnExportarCSV">Exportar Excel</button>
      </div>
    </div>
    ${confirmado?`<div class="card" style="padding:12px 16px;margin:14px 0;border-color:var(--ok);display:flex;align-items:center;gap:10px">
      <span class="pill ok">🔒 Cierre confirmado</span>
      <span class="section-sub" style="margin:0">Confirmado ${fmtTime(confirmado.confirmadoEn)}hs. Este día ya no se puede modificar.</span>
    </div>`:''}
    <div class="grid-cards" style="margin:14px 0">
      <div class="card" style="padding:14px"><div class="prod-meta">Ventas totales</div><div class="prod-price" style="font-size:20px">${fmtMoney(totalVentas)}</div></div>
      <div class="card" style="padding:14px"><div class="prod-meta">Mesas cerradas</div><div class="prod-price" style="font-size:20px">${cerrados.length}</div></div>
      <div class="card" style="padding:14px"><div class="prod-meta">Pedidos cancelados</div><div class="prod-price" style="font-size:20px">${cancelados.length}</div></div>
      <div class="card" style="padding:14px"><div class="prod-meta">Personas atendidas</div><div class="prod-price" style="font-size:20px">${totalPersonas}</div></div>
      <div class="card" style="padding:14px"><div class="prod-meta">Tenedores usados</div><div class="prod-price" style="font-size:20px">${totalTenedores}</div></div>
      ${costoDia.tiene?`<div class="card" style="padding:14px"><div class="prod-meta">Costo de lo vendido (est.)</div><div class="prod-price" style="font-size:20px">${fmtMoney(costoDia.costo)}</div><div class="prod-meta">${totalVentas>0?Math.round(costoDia.costo/totalVentas*100):0}% de las ventas${costoDia.sinReceta?' · '+costoDia.sinReceta+' unid. sin receta':''}</div></div>
      <div class="card" style="padding:14px"><div class="prod-meta">Margen bruto (est.)</div><div class="prod-price" style="font-size:20px;color:var(--ok)">${fmtMoney(totalVentas-costoDia.costo)}</div><div class="prod-meta">${totalVentas>0?Math.round((1-costoDia.costo/totalVentas)*100):0}% de las ventas</div></div>`:''}
    </div>
    ${cajaDelDia?`<div class="card" style="padding:14px;margin-bottom:18px">
      <h3 style="font-size:15px;margin:0 0 8px">Caja del día</h3>
      <p class="section-sub" style="margin:0">Inicial ${fmtMoney(cajaDelDia.montoInicial)} ${cajaDelDia.abierta?'· <span class="pill busy">Abierta</span>':`· contado ${fmtMoney(cajaDelDia.montoRealCierre||0)} · diferencia <b style="color:${cajaDelDia.diferencia===0?'var(--ok)':'var(--danger)'}">${fmtMoney(cajaDelDia.diferencia||0)}</b>`}</p>
    </div>`:''}
    ${plegAbrir('productos','Productos vendidos', aggList.length+' producto(s) · '+aggList.reduce((t,[,c])=>t+c,0)+' unidades')}
    <div class="card" style="overflow-x:auto;margin-bottom:18px">
      <table><thead><tr><th>Producto</th><th>Cantidad</th></tr></thead><tbody>
        ${aggList.length===0?'<tr><td colspan="2"><div class="empty">Sin ventas cerradas para esta fecha.</div></td></tr>':
          aggList.map(([n,c])=>`<tr><td>${esc(n)}</td><td>${c}</td></tr>`).join('')}
      </tbody></table>
    </div>
    </div></details>
    ${plegAbrir('detalle','Detalle por mesa', cerrados.length+' mesa(s)')}
    <div style="display:flex;flex-direction:column;gap:10px;margin-bottom:18px">
      ${cerrados.length===0?'<div class="card empty">Sin cierres registrados.</div>':
        cerrados.map(p=>`<div class="card" style="padding:12px 14px">
          <div style="display:flex;justify-content:space-between"><b>Mesa ${esc(p.mesaNumero)}</b><span>${fmtMoney(p.total)} · ${esc(p.medioPago||'—')}</span></div>
          <div class="prod-meta">${p.personas} personas · ${p.tenedores} tenedores · cerrada ${fmtTime(p.cerrado)}hs</div>
